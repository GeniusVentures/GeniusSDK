# Ceremony E2E CI (CI-01) — runs the ceremony e2e suite (happy path, the four
# resilience scenarios, the dht-health gate, and the stranded-genesis
# negative control) against an EPHEMERAL LOCAL NET only: reserved-band
# network ids asserted in-band by the harness; no persistent fleet endpoint
# anywhere in this workflow; strict gate only (D-14 — the A6 fallback flag is
# a local-debugging tool and is never passed here; anything weaker is a red
# build). The nightly dht-health leg runs on DEFAULT reserved-band draws —
# CI never pins the staging id 333 (NET-05; the 333 proof is the one-time
# local pre-provision gate, 04-01).
#
# Binary acquisition mirrors GeniusSDK/.github/workflows/cmake.yml exactly
# (D-11): resolve-runners probe, AlmaLinux 8 container, the three
# gh release download steps, clang-pinned configure. Node processes need a
# secret service (libsecret is the unconditional Linux backend), so every
# harness invocation runs inside the dbus-run-session + gnome-keyring wrapper
# proven by SuperGenius's ctest step.
#
# Triggers (D-13): push/PR run happy + ONE scenario rotated by run number +
# the negative control on every happy run; the nightly schedule and the
# 'nightly' dispatch mode run the full matrix as independent fail-fast:false
# legs. Note: GitHub runs schedules only on the default branch, so the nightly
# cron goes live once this workflow reaches develop/main; dispatch proves the
# matrix from any branch.
#
# DELIBERATELY NO paths-ignore: the existing release workflow ignores
# .github/** paths, which would suppress the very push that lands THIS file —
# the first run must trigger.
name: Ceremony E2E CI

on:
  push:
    branches:
      - develop
      - main
      - feat_staging_net
  pull_request:
    branches:
      - develop
      - main
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: "Which ceremony e2e shape to run"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - happy
          - restart-mid-ceremony
          - restart-mid-sync
          - quorum-loss
          - window-edge
          - negative-control
          - nightly
          # Phase 5 dispatch-only legs (05-02/05-03): the hosted external
          # joiner against the LIVE staging net, its wrong-net refusal
          # sibling (a staging-refuse dispatch runs BOTH refusal legs — net
          # AND version), and the source-build session binary.
          - staging-join
          - staging-refuse
          - staging-session-bin
      liveness:
        description: "staging-join only: run the 30-min transaction-arrival observation window after READY (05-04's witnessed shape)"
        required: false
        type: boolean
        default: false

# Less than the release workflow's contents: write — this workflow uploads
# nothing to releases; GNUS_TOKEN_1 is only used for the mirrored
# gh release download steps and the container pull. The ONE job-scoped
# exception is node-image: it carries packages: write to publish the NAS
# runtime image to ghcr, and only from a green push-shape e2e run — every
# other job stays read-only.
permissions:
  contents: read
  packages: read

# One in-flight run per ref (D-13): queue, never cancel — a cancelled e2e run
# leaves stragglers on the shared self-hosted box (the always() cleanup step
# only runs when the job itself gets to execute).
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-runners:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
    outputs:
      linux_x64: ${{ steps.pick.outputs.linux_x64 }}
    steps:
      - name: Check self-hosted runner availability
        id: pick
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ORG="${REPO%%/*}"
          repo_err="$(mktemp)"
          org_err="$(mktemp)"

          # Some org-scoped runners may not show up via the repo endpoint for this token.
          # Query both scopes and merge the results.
          if repo_data="$(gh api "/repos/$REPO/actions/runners" --paginate 2>"$repo_err")"; then
            echo "Repository runner API query succeeded for $REPO"
          else
            echo "Repository runner API query failed for $REPO; continuing with empty repo runner set"
            repo_data='{"runners":[]}'
          fi

          if org_data="$(gh api "/orgs/$ORG/actions/runners" --paginate 2>"$org_err")"; then
            echo "Organization runner API query succeeded for $ORG"
          else
            echo "Organization runner API query failed for $ORG; continuing with empty org runner set"
            org_data='{"runners":[]}'
          fi

          data="$(jq -n --argjson repo "$repo_data" --argjson org "$org_data" '{runners: (($repo.runners // []) + ($org.runners // []) | unique_by(.id))}')"

          repo_count="$(echo "$repo_data" | jq -r '(.runners // []) | length')"
          org_count="$(echo "$org_data" | jq -r '(.runners // []) | length')"
          merged_count="$(echo "$data" | jq -r '(.runners // []) | length')"

          echo "Runner counts: repo=$repo_count org=$org_count merged=$merged_count"
          if [ "$org_count" -eq 0 ] && [ -s "$org_err" ]; then
            echo "Org endpoint error output:"
            cat "$org_err"
          fi

          echo "Discovered self-hosted runners for $REPO (repo+org merged):"
          echo "$data" | jq -r '.runners[]? | "- \(.name) | status=\(.status) | busy=\(.busy) | labels=\([.labels[].name] | join(", "))"'

          {
            echo "## Runner availability"
            echo
            echo "Repository: $REPO"
            echo "Organization: $ORG"
            echo "Counts: repo=$repo_count org=$org_count merged=$merged_count"
            echo
            echo "Discovered runners (repo+org merged):"
            echo "$data" | jq -r '.runners[]? | "- \(.name) | status=\(.status) | busy=\(.busy) | labels=\([.labels[].name] | join(", "))"'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Define JSON arrays using single quotes so real double-quotes are preserved.
          SH_LINUX_X64='["self-hosted","sg-ubuntu-linux"]'
          FB_LINUX='["ubuntu-latest"]'

          # Returns the self-hosted label array if at least one matching runner
          # is online and not busy, otherwise returns the GitHub-hosted fallback.
          # Match either runner name or label/tag text, case-insensitively.
          pick_runner() {
            local label="$1" self_hosted="$2" fallback="$3"
            if echo "$data" | jq -e --arg L "$label" \
              '.runners[]
               | select(.status=="online" and (.busy|not))
               | select((.name | ascii_downcase) == ($L | ascii_downcase)
                 or any(.labels[]; (.name | ascii_downcase) == ($L | ascii_downcase)))' \
              >/dev/null 2>&1; then
              echo "Selector '$label' matched an available self-hosted runner" >&2
              echo "- $label: self-hosted" >> "$GITHUB_STEP_SUMMARY"
              echo "$self_hosted"
            else
              echo "Selector '$label' did not match an available self-hosted runner" >&2
              echo "- $label: fallback" >> "$GITHUB_STEP_SUMMARY"
              echo "$fallback"
            fi
          }

          echo "linux_x64=$(pick_runner 'sg-ubuntu-linux' "$SH_LINUX_X64" "$FB_LINUX")"   >> "$GITHUB_OUTPUT"

  # Push/PR/dispatch shape: ONE job, ONE build, then (D-13) the happy path +
  # the run-number-rotated scenario + the negative control, sequentially.
  e2e:
    needs: resolve-runners
    # The staging-* dispatch scenarios (05-02/05-03) never run the e2e suite:
    # they are deliberate live-net legs with their own jobs below — a joiner
    # dispatch must not also spin the full build + local-net harness on the
    # shared self-hosted box.
    if: ${{ github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && (inputs.scenario == 'nightly' || inputs.scenario == 'staging-join' || inputs.scenario == 'staging-refuse' || inputs.scenario == 'staging-session-bin')) }}
    runs-on: ${{ fromJson(needs.resolve-runners.outputs.linux_x64) }}
    timeout-minutes: 120
    env:
      GRPC_BUILD_ENABLE_CCACHE: "ON"
      GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
    container:
      image: ghcr.io/geniusventures/almalinux-8:latest
      # IPC_LOCK mirrors SuperGenius's build job (its cmake.yml container):
      # EL8's gnome-keyring-daemon carries file capabilities, and exec of a
      # file-caps binary in a container whose bounding set lacks the cap
      # returns EPERM — observed in run 37803667091 as "bash:
      # /usr/bin/gnome-keyring-daemon: Operation not permitted", leaving the
      # nodes without a secret service. The dbus wrapper below needs this.
      options: --cap-add=IPC_LOCK
      credentials:
        username: ${{github.actor}}
        password: ${{secrets.GNUS_TOKEN_1}}
    steps:
      - name: Clean workspace (self-hosted runners)
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          # Use sudo on Linux to handle root-owned files left by container jobs
          SUDO=""
          if [ "$(uname)" = "Linux" ]; then
            SUDO="sudo"
          fi

          echo "=== PRE-CLEANUP DEBUG ==="
          echo "Current working directory: $(pwd)"
          echo "Workspace: ${{github.workspace}}"

          if [ -d "${{github.workspace}}" ]; then
            cd "${{github.workspace}}"
            echo "Changed to workspace directory: $(pwd)"
            echo "Contents:"
            ls -la

            if [ -d ".git" ]; then
              echo "Git repository detected, performing deep clean..."
              # Remove stale lock files first
              echo "Removing stale git lock files..."
              find . -name "index.lock" -type f -delete 2>/dev/null || true
              find . -name "*.lock" -path "*/.git/*" -type f -delete 2>/dev/null || true

              git clean -xfd
              git submodule foreach --recursive git clean -xfd
              git reset --hard
              git submodule foreach --recursive git reset --hard
              echo "Git clean completed"
            else
              echo "Not a git repository, skipping git clean"
            fi
          else
            echo "Workspace directory does not exist yet, skipping cleanup"
          fi

          echo "=== CLEANUP ARTIFACTS ==="
          # Clean up artifacts from previous runs (self-hosted runners only)
          for dir in thirdparty zkLLVM SuperGenius GeniusSDK; do
            if [ -d "$dir" ]; then
              echo "Removing $dir directory..."
              $SUDO rm -rf "$dir"
            fi
          done

          echo "=== POST-CLEANUP DEBUG ==="
          if [ -d "${{github.workspace}}" ]; then
            cd "${{github.workspace}}"
            echo "Final workspace contents:"
            ls -la
          fi

      - name: Checkout GeniusSDK
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: "GeniusSDK"
          submodules: "recursive"

      - name: Set build directory
        shell: bash
        run: |
          # Linux x86_64 Release with the abi subfolder, exactly like the
          # release matrix include: the thirdparty/zkLLVM tarballs extract to
          # build/Linux/Release/x86_64, and GeniusSDK CMake's canonical
          # dependency paths append ABI_SUBFOLDER_NAME the same way — the
          # abi-less form would point THIRDPARTY_BUILD_DIR nowhere.
          BUILD_DIRECTORY=build/Linux/Release/x86_64
          echo "BUILD_DIRECTORY=$BUILD_DIRECTORY" >> $GITHUB_ENV

      - name: Download thirdparty release
        working-directory: ${{github.workspace}}
        shell: bash
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.pull_request.head.ref }}
        run: |
          # Determine current branch or tag
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${GITHUB_EVENT_INPUTS_TAG}" ]; then
            CURRENT_BRANCH="${GITHUB_EVENT_INPUTS_TAG}"
            IS_TAG=true
          elif ${{github.event_name == 'pull_request'}}; then
            CURRENT_BRANCH=${GITHUB_EVENT_PULL_REQUEST_HEAD_REF}
            IS_TAG=false
          else
            CURRENT_BRANCH=$GITHUB_REF_NAME
            IS_TAG=false
          fi

          echo "Identified current branch/tag as ${CURRENT_BRANCH}"
          echo "CURRENT_BRANCH=${CURRENT_BRANCH}" >>$GITHUB_ENV
          echo "IS_TAG=${IS_TAG}" >>$GITHUB_ENV

          # Determine thirdparty branch to use
          if [ "$IS_TAG" == "true" ]; then
            # For tags, use the exact tag name for thirdparty
            thirdparty_branch="$CURRENT_BRANCH"
          elif [ "$CURRENT_BRANCH" == "main" ]; then
            thirdparty_branch="main"
          else
            thirdparty_branch="develop"
          fi

          echo "Using ${thirdparty_branch} for thirdparty"

          # Fixed e2e target: Linux x86_64 Release (abi always present, as in
          # the release matrix — every non-tag branch maps to develop).
          FILE_NAME=Linux-x86_64-Release.tar.gz
          echo "FILE_NAME=${FILE_NAME}" >> $GITHUB_ENV

          mkdir thirdparty
          cd thirdparty

          if [ "$IS_TAG" == "true" ]; then
            # For tags, use just the tag name
            tag_name="${thirdparty_branch}"
          else
            # For branches, use the platform-branch-buildtype format
            tag_name="Linux-x86_64-${thirdparty_branch}-Release"
          fi

          gh release download ${tag_name} --repo GeniusVentures/thirdparty -p "${FILE_NAME}"
          tar -zxf "${FILE_NAME}"

          # Set THIRDPARTY_BUILD_DIR to the actual location where files were extracted

          echo "THIRDPARTY_BUILD_DIR=$(pwd)/${BUILD_DIRECTORY}" >> $GITHUB_ENV

      - name: Download zkLLVM release
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          # Use same branch determination logic for zkLLVM
          if [ "$IS_TAG" == "true" ]; then
            # For tags, use the exact tag name for zkLLVM
            zkLLVM_branch="$CURRENT_BRANCH"
          elif [ "$CURRENT_BRANCH" == "main" ]; then
            zkLLVM_branch="main"
          else
            zkLLVM_branch="develop"
          fi

          mkdir zkLLVM
          cd zkLLVM

          ZKLLVM_FILE_NAME=Linux-x86_64-Release.tar.gz
          ZKLLVM_BUILD_DIR=${BUILD_DIRECTORY}
          if [ "$IS_TAG" == "true" ]; then
            tag_name="${zkLLVM_branch}"
          else
            tag_name="Linux-x86_64-${zkLLVM_branch}-Release"
          fi

          gh release download ${tag_name} --repo GeniusVentures/zkLLVM -p "${ZKLLVM_FILE_NAME}"

          tar --exclude='*bin/assigner' --exclude='*bin/clang-zkllvm' --exclude='*bin/llvm-link-zkllvm' --exclude='*bin/transpiler' -zxf "${ZKLLVM_FILE_NAME}"

          # Set ZKLLVM_BUILD_DIR to the actual location where files were extracted

          echo "ZKLLVM_BUILD_DIR=$(pwd)/${ZKLLVM_BUILD_DIR}" >> $GITHUB_ENV

      - name: Download SuperGenius
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          # Use same branch determination logic for SuperGenius. KEEP THE
          # MAPPING EXACT (D-11): every non-main branch — including
          # feat_staging_net — maps to the develop tarball (SuperGenius
          # publishes releases only from develop/main); there is no
          # feat_staging_net tarball path. The e2e build compiles against
          # this tarball and service.cpp calls the GetGenesisCID accessor
          # (plan 03-01), so the develop release must contain it.
          if [ "$IS_TAG" == "true" ]; then
            # For tags, use the exact tag name for SuperGenius
            sgns_branch="$CURRENT_BRANCH"
          elif [ "$CURRENT_BRANCH" == "main" ]; then
            sgns_branch="main"
          else
            sgns_branch="develop"
          fi

          echo "Using ${sgns_branch} branch/tag from SuperGenius"

          mkdir SuperGenius
          cd SuperGenius

          if [ "$IS_TAG" == "true" ]; then
            # For tags, use just the tag name
            tag_name="${sgns_branch}"
          else
            # For branches, use the platform-branch-buildtype format
            tag_name="Linux-x86_64-${sgns_branch}-Release"
          fi

          gh release download ${tag_name} --repo GeniusVentures/SuperGenius -p "${FILE_NAME}"

          tar -xzf "${FILE_NAME}"

          echo "SUPERGENIUS_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Configure Linux host
        if: ${{ runner.os == 'Linux'}}
        run: |
          sudo update-alternatives --install /usr/bin/cc cc $(which clang) 100
          sudo update-alternatives --install /usr/bin/c++ c++ $(which clang++) 100
          sudo update-alternatives --set cc $(which clang)
          sudo update-alternatives --set c++ $(which clang++)

          # Native Linux builds run in the AlmaLinux 8 CI image (glibc 2.28
          # floor, replacing the EOL Debian Bullseye container). The image
          # ships clang, cmake, ninja, Vulkan headers, and libsecret, so the
          # dnf branch is a guarded safety net that avoids repo traffic when
          # the image already provides everything; Ubuntu runners (the
          # resolve-runners fallback, which runs this same container, or a
          # no-container future) still need apt.
          if command -v dnf >/dev/null 2>&1; then
            if ! rpm -q ccache ninja-build vulkan-loader-devel libsecret-devel libzstd-devel >/dev/null 2>&1; then
              sudo dnf install -y ccache ninja-build vulkan-loader-devel libsecret-devel libzstd-devel
            fi
          else
            sudo apt install ccache ninja-build libvulkan-dev libzstd-dev libsecret-1-dev -y
          fi
          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV

      - name: Provision python3.12
        shell: bash
        run: |
          # EL8's default python3 is 3.6; the harness needs 3.10+ and is
          # invoked as python3.12 explicitly everywhere. The container is
          # ephemeral per job, so this check runs on every job (D-12,
          # research Pitfall 4). dnf branch first (AlmaLinux 8 AppStream),
          # apt for the hosted-fallback distro.
          if command -v python3.12 >/dev/null 2>&1; then
            echo "python3.12 already present"
          elif command -v dnf >/dev/null 2>&1; then
            # GHA container jobs run as root; sudo may be absent in the image.
            SUDO=""
            command -v sudo >/dev/null 2>&1 && SUDO="sudo"
            $SUDO dnf install -y python3.12
          else
            sudo apt-get update
            sudo apt-get install -y python3.12
          fi
          python3.12 --version

      - name: Capacity probe (runner evidence, research A4)
        shell: bash
        run: |
          # First-run evidence for the unmeasured runner box: if the numbers
          # prove memory-tight for the 5-node net, surface them — the 3-node
          # variant stays deferred unless measurements demand it. Values go
          # to BOTH the step summary and the log (the summary is not
          # retrievable via the API, the log is).
          free_out="$(free -h 2>/dev/null || echo "free not available")"
          echo "capacity probe: nproc=$(nproc) python=$(python3.12 --version 2>&1)"
          echo "$free_out"
          {
            echo "## Ceremony e2e runner capacity"
            echo
            echo "- nproc: $(nproc)"
            echo "- python: $(python3.12 --version 2>&1)"
            echo
            echo '```'
            echo "$free_out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure CMake for Linux
        working-directory: ${{github.workspace}}/GeniusSDK
        # Pin clang explicitly rather than relying on the /usr/bin/cc and
        # /usr/bin/c++ update-alternatives symlinks: on AlmaLinux 8
        # /usr/bin/c++ is a real file owned by gcc-c++ (not an alternatives
        # symlink like Debian's), so the update-alternatives takeover fails
        # silently and CMake falls back to g++ 8.5, which cannot compile the
        # code built here (same failure observed in SuperGenius run
        # 35377550250).
        shell: bash
        run: cmake -S build/Linux -B $BUILD_DIRECTORY -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=$(which clang) -DCMAKE_CXX_COMPILER=$(which clang++) -DTHIRDPARTY_BUILD_DIR=${{env.THIRDPARTY_BUILD_DIR}} -DZKLLVM_BUILD_DIR=${{env.ZKLLVM_BUILD_DIR}} -DSUPERGENIUS_DIR=${{env.SUPERGENIUS_DIR}} -DABI_SUBFOLDER_NAME='/x86_64'

      - name: Build GeniusSDK
        working-directory: ${{github.workspace}}/GeniusSDK/${{env.BUILD_DIRECTORY}}
        shell: bash
        run: cmake --build . --config Release -j

      - name: Resolve harness binaries
        shell: bash
        run: |
          # Fail fast at the boundary: both binaries must exist and be
          # executable before the harness runs. The canonical sgns-trust
          # path mirrors the local install-tree layout
          # (build/<platform>/<type>/<abi>/SuperGenius/bin); the find
          # fallback verifies the extracted tarball's actual layout on the
          # first run.
          RUNNER_BIN="$GITHUB_WORKSPACE/GeniusSDK/${BUILD_DIRECTORY}/services/GeniusSDKService"
          if [ ! -x "$RUNNER_BIN" ]; then
            RUNNER_BIN="$(find "$GITHUB_WORKSPACE/GeniusSDK/build" -type f -name GeniusSDKService -perm -u+x 2>/dev/null | head -n 1)"
          fi
          if [ -z "$RUNNER_BIN" ] || [ ! -x "$RUNNER_BIN" ]; then
            echo "FATAL: GeniusSDKService not found under $GITHUB_WORKSPACE/GeniusSDK/build" >&2
            exit 1
          fi

          SGNS_TRUST_BIN="$SUPERGENIUS_DIR/${BUILD_DIRECTORY}/SuperGenius/bin/sgns-trust"
          if [ ! -x "$SGNS_TRUST_BIN" ]; then
            SGNS_TRUST_BIN="$(find "$SUPERGENIUS_DIR" -type f -name sgns-trust -perm -u+x 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SGNS_TRUST_BIN" ] || [ ! -x "$SGNS_TRUST_BIN" ]; then
            echo "FATAL: sgns-trust not found in the extracted SuperGenius tree ($SUPERGENIUS_DIR)" >&2
            exit 1
          fi

          echo "RUNNER_BIN=$RUNNER_BIN" >> "$GITHUB_ENV"
          echo "SGNS_TRUST_BIN=$SGNS_TRUST_BIN" >> "$GITHUB_ENV"
          echo "- runner: $RUNNER_BIN" >> "$GITHUB_STEP_SUMMARY"
          echo "- sgns-trust: $SGNS_TRUST_BIN" >> "$GITHUB_STEP_SUMMARY"

      - name: Select e2e mode (rotation on push/PR)
        shell: bash
        env:
          DISPATCH_SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          # The dispatch input arrives via env (choice-list constrained,
          # never interpolated into shell) and is matched against fixed
          # tokens only. 'all' (also the push/PR default): happy + ONE
          # scenario rotated by run number (zero state, deterministic,
          # D-13) + the negative control on every happy run (D-15).
          MODE="${DISPATCH_SCENARIO:-all}"
          RUN_HAPPY=false
          RUN_SCENARIO=""
          RUN_NEGATIVE=false
          case "$MODE" in
            all)
              RUN_HAPPY=true
              RUN_NEGATIVE=true
              SCENARIOS=(restart-mid-ceremony restart-mid-sync quorum-loss window-edge)
              RUN_SCENARIO="${SCENARIOS[$(( ${{ github.run_number }} % 4 ))]}"
              ;;
            happy)
              RUN_HAPPY=true
              ;;
            negative-control)
              RUN_NEGATIVE=true
              ;;
            restart-mid-ceremony|restart-mid-sync|quorum-loss|window-edge)
              RUN_SCENARIO="$MODE"
              ;;
            *)
              echo "FATAL: unknown scenario mode: $MODE" >&2
              exit 1
              ;;
          esac
          echo "RUN_HAPPY=$RUN_HAPPY" >> "$GITHUB_ENV"
          echo "RUN_SCENARIO=$RUN_SCENARIO" >> "$GITHUB_ENV"
          echo "RUN_NEGATIVE=$RUN_NEGATIVE" >> "$GITHUB_ENV"
          {
            echo "## Ceremony e2e invocation plan"
            echo
            echo "- mode: $MODE"
            echo "- happy path: $RUN_HAPPY"
            echo "- scenario: ${RUN_SCENARIO:-none}"
            echo "- negative control: $RUN_NEGATIVE"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run ceremony e2e (happy + rotated scenario + negative control)
        shell: bash
        run: |
          # Node processes use libsecret (unconditional on Linux); without a
          # secret service they never leave INITIALIZING_DATABASE — the
          # wrapper below is copied verbatim from SuperGenius's ctest step
          # and proven in this exact image. Env (RUN_*, RUNNER_BIN,
          # SGNS_TRUST_BIN, GITHUB_WORKSPACE, RUNNER_TEMP) propagates
          # untouched through dbus-run-session / bash -c: pass values
          # through the ENVIRONMENT, never through eval'd string
          # re-parsing, and NO single quotes inside the single-quoted
          # bash -c body (they would close the wrapper string).
          dbus-run-session -- bash -c '\
            mkdir -p ~/.cache ~/.local/share/keyrings && \
            echo -n "login" > ~/.local/share/keyrings/default && \
            echo "[keyring]
            display-name=login
            lock-on-idle=false
            lock-after=false" > ~/.local/share/keyrings/login.keyring && \
            eval $(printf "\n" | gnome-keyring-daemon --unlock --components=secrets) && \
            run_case() {
              label="$1"
              expected="$2"
              shift 2
              log="${RUNNER_TEMP:-/tmp}/ceremony-e2e-$label.log"
              python3.12 "$GITHUB_WORKSPACE/GeniusSDK/e2e/ceremony_e2e.py" --nodes 5 \
                --runner "$RUNNER_BIN" --sgns-trust "$SGNS_TRUST_BIN" "$@" 2>&1 | tee "$log"
              rc="${PIPESTATUS[0]}"
              echo "CASE $label: exit=$rc (expected $expected)"
              if [ "$rc" -ne "$expected" ]; then
                echo "FAIL: ceremony case $label exited $rc, expected $expected"
                return 1
              fi
              if [ "$expected" -eq 2 ] && ! grep -q "STRANDED-GENESIS-DETECTED" "$log"; then
                echo "FAIL: negative control exited 2 but the STRANDED-GENESIS-DETECTED marker is missing"
                return 1
              fi
              return 0
            }
            status=0
            if [ "$RUN_HAPPY" = "true" ]; then
              run_case happy 0 || status=1
            fi
            if [ -n "$RUN_SCENARIO" ]; then
              run_case "$RUN_SCENARIO" 0 || status=1
            fi
            if [ "$RUN_NEGATIVE" = "true" ]; then
              run_case negative-control 2 --approve-peers 2 || status=1
            fi
            exit "$status"'

      - name: Record runner dependency closure (ldd + sha256)
        # ldd runs in the SAME EL8 container that built the binary (this
        # job's container), so the closure is the real runtime dependency
        # set. The sha256 line is the recorded digest the node-image job
        # re-verifies before the image build and 04-05 pins into
        # staging-net.json (T-04-02-02). BOTH files stage into ONE
        # workspace dir so the artifact uploads FLAT: upload-artifact
        # stores paths relative to the least-common-ancestor of the given
        # paths and drops files outside the workspace — two unrelated
        # roots nested the binary deep in the artifact and silently lost
        # runner-ldd.txt entirely (run 38437902892, "1 file uploaded").
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          stage="$GITHUB_WORKSPACE/runner-stage"
          mkdir -p "$stage"
          cp "$RUNNER_BIN" "$stage/GeniusSDKService"
          {
            ldd "$RUNNER_BIN"
            echo "sha256: $(sha256sum "$RUNNER_BIN" | cut -d' ' -f1)"
          } | tee "$stage/runner-ldd.txt"

      - name: Upload runner binary + dependency closure
        # The AWS genesis distribution path (binary + closure scp'd on-box,
        # 04-04) AND the node-image job's build input. The single staged
        # directory is the artifact root — the node-image job downloads
        # GeniusSDKService and runner-ldd.txt at ITS workspace root.
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: runner-binary
          path: ${{ github.workspace }}/runner-stage
          if-no-files-found: error
          retention-days: 14

      - name: Upload ceremony e2e failure artifacts
        # ONLY the harness's scrubbed artifacts directory: the D-07
        # scrub-before-preserve plus the non-vacuous key-absence scan gate
        # that directory before anything is kept — raw run dirs or workspace
        # paths are never uploaded (key material must not leak, T-03-13).
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ceremony-e2e-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/GeniusSDK/e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup stragglers
        if: always()
        shell: bash
        run: |
          # Guarded: pkill exits 1 when nothing matched — cleanup never fails
          # the job. A single runner executes one job at a time, so these
          # can only be strays from THIS run (timeout/interrupt paths).
          pkill -x GeniusSDKService 2>/dev/null || true
          pkill -x sgns-trust 2>/dev/null || true

  # Nightly shape (schedule + dispatch 'nightly'): the full matrix as
  # independent fail-fast:false legs — one leg's failure or hang never
  # cancels the others (Pitfall 9), and the nightly catch of SuperGenius
  # develop drift (D-10) needs every scenario observable on its own.
  e2e-nightly:
    needs: resolve-runners
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scenario == 'nightly') }}
    runs-on: ${{ fromJson(needs.resolve-runners.outputs.linux_x64) }}
    timeout-minutes: 120
    env:
      GRPC_BUILD_ENABLE_CCACHE: "ON"
      GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
    container:
      image: ghcr.io/geniusventures/almalinux-8:latest
      # IPC_LOCK mirrors SuperGenius's build job (its cmake.yml container):
      # EL8's gnome-keyring-daemon carries file capabilities, and exec of a
      # file-caps binary in a container whose bounding set lacks the cap
      # returns EPERM — observed in run 37803667091 as "bash:
      # /usr/bin/gnome-keyring-daemon: Operation not permitted", leaving the
      # nodes without a secret service. The dbus wrapper below needs this.
      options: --cap-add=IPC_LOCK
      credentials:
        username: ${{github.actor}}
        password: ${{secrets.GNUS_TOKEN_1}}
    strategy:
      fail-fast: false
      matrix:
        mode: [happy, restart-mid-ceremony, restart-mid-sync, quorum-loss, window-edge, negative-control, dht-health]
    steps:
      - name: Clean workspace (self-hosted runners)
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          # Use sudo on Linux to handle root-owned files left by container jobs
          SUDO=""
          if [ "$(uname)" = "Linux" ]; then
            SUDO="sudo"
          fi

          echo "=== PRE-CLEANUP DEBUG ==="
          echo "Current working directory: $(pwd)"
          echo "Workspace: ${{github.workspace}}"

          if [ -d "${{github.workspace}}" ]; then
            cd "${{github.workspace}}"
            echo "Changed to workspace directory: $(pwd)"
            echo "Contents:"
            ls -la

            if [ -d ".git" ]; then
              echo "Git repository detected, performing deep clean..."
              # Remove stale lock files first
              echo "Removing stale git lock files..."
              find . -name "index.lock" -type f -delete 2>/dev/null || true
              find . -name "*.lock" -path "*/.git/*" -type f -delete 2>/dev/null || true

              git clean -xfd
              git submodule foreach --recursive git clean -xfd
              git reset --hard
              git submodule foreach --recursive git reset --hard
              echo "Git clean completed"
            else
              echo "Not a git repository, skipping git clean"
            fi
          else
            echo "Workspace directory does not exist yet, skipping cleanup"
          fi

          echo "=== CLEANUP ARTIFACTS ==="
          # Clean up artifacts from previous runs (self-hosted runners only)
          for dir in thirdparty zkLLVM SuperGenius GeniusSDK; do
            if [ -d "$dir" ]; then
              echo "Removing $dir directory..."
              $SUDO rm -rf "$dir"
            fi
          done

          echo "=== POST-CLEANUP DEBUG ==="
          if [ -d "${{github.workspace}}" ]; then
            cd "${{github.workspace}}"
            echo "Final workspace contents:"
            ls -la
          fi

      - name: Checkout GeniusSDK
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: "GeniusSDK"
          submodules: "recursive"

      - name: Set build directory
        shell: bash
        run: |
          # Same abi-suffixed layout as the e2e job — see the comment there.
          BUILD_DIRECTORY=build/Linux/Release/x86_64
          echo "BUILD_DIRECTORY=$BUILD_DIRECTORY" >> $GITHUB_ENV

      - name: Download thirdparty release
        working-directory: ${{github.workspace}}
        shell: bash
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.pull_request.head.ref }}
        run: |
          # Determine current branch or tag
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${GITHUB_EVENT_INPUTS_TAG}" ]; then
            CURRENT_BRANCH="${GITHUB_EVENT_INPUTS_TAG}"
            IS_TAG=true
          elif ${{github.event_name == 'pull_request'}}; then
            CURRENT_BRANCH=${GITHUB_EVENT_PULL_REQUEST_HEAD_REF}
            IS_TAG=false
          else
            CURRENT_BRANCH=$GITHUB_REF_NAME
            IS_TAG=false
          fi

          echo "Identified current branch/tag as ${CURRENT_BRANCH}"
          echo "CURRENT_BRANCH=${CURRENT_BRANCH}" >>$GITHUB_ENV
          echo "IS_TAG=${IS_TAG}" >>$GITHUB_ENV

          # Determine thirdparty branch to use
          if [ "$IS_TAG" == "true" ]; then
            thirdparty_branch="$CURRENT_BRANCH"
          elif [ "$CURRENT_BRANCH" == "main" ]; then
            thirdparty_branch="main"
          else
            thirdparty_branch="develop"
          fi

          echo "Using ${thirdparty_branch} for thirdparty"

          FILE_NAME=Linux-x86_64-Release.tar.gz
          echo "FILE_NAME=${FILE_NAME}" >> $GITHUB_ENV

          mkdir thirdparty
          cd thirdparty

          if [ "$IS_TAG" == "true" ]; then
            tag_name="${thirdparty_branch}"
          else
            tag_name="Linux-x86_64-${thirdparty_branch}-Release"
          fi

          gh release download ${tag_name} --repo GeniusVentures/thirdparty -p "${FILE_NAME}"
          tar -zxf "${FILE_NAME}"

          echo "THIRDPARTY_BUILD_DIR=$(pwd)/${BUILD_DIRECTORY}" >> $GITHUB_ENV

      - name: Download zkLLVM release
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          # Use same branch determination logic for zkLLVM
          if [ "$IS_TAG" == "true" ]; then
            zkLLVM_branch="$CURRENT_BRANCH"
          elif [ "$CURRENT_BRANCH" == "main" ]; then
            zkLLVM_branch="main"
          else
            zkLLVM_branch="develop"
          fi

          mkdir zkLLVM
          cd zkLLVM

          ZKLLVM_FILE_NAME=Linux-x86_64-Release.tar.gz
          ZKLLVM_BUILD_DIR=${BUILD_DIRECTORY}
          if [ "$IS_TAG" == "true" ]; then
            tag_name="${zkLLVM_branch}"
          else
            tag_name="Linux-x86_64-${zkLLVM_branch}-Release"
          fi

          gh release download ${tag_name} --repo GeniusVentures/zkLLVM -p "${ZKLLVM_FILE_NAME}"

          tar --exclude='*bin/assigner' --exclude='*bin/clang-zkllvm' --exclude='*bin/llvm-link-zkllvm' --exclude='*bin/transpiler' -zxf "${ZKLLVM_FILE_NAME}"

          echo "ZKLLVM_BUILD_DIR=$(pwd)/${ZKLLVM_BUILD_DIR}" >> $GITHUB_ENV

      - name: Download SuperGenius
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          # Same branch/tag determination as the e2e job — every non-main
          # branch maps to the SuperGenius develop tarball (the nightly
          # drift catch, D-10: this is the leg that notices SuperGenius
          # develop breaking the ceremony).
          if [ "$IS_TAG" == "true" ]; then
            sgns_branch="$CURRENT_BRANCH"
          elif [ "$CURRENT_BRANCH" == "main" ]; then
            sgns_branch="main"
          else
            sgns_branch="develop"
          fi

          echo "Using ${sgns_branch} branch/tag from SuperGenius"

          mkdir SuperGenius
          cd SuperGenius

          if [ "$IS_TAG" == "true" ]; then
            tag_name="${sgns_branch}"
          else
            tag_name="Linux-x86_64-${sgns_branch}-Release"
          fi

          gh release download ${tag_name} --repo GeniusVentures/SuperGenius -p "${FILE_NAME}"

          tar -xzf "${FILE_NAME}"

          echo "SUPERGENIUS_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Configure Linux host
        if: ${{ runner.os == 'Linux'}}
        run: |
          sudo update-alternatives --install /usr/bin/cc cc $(which clang) 100
          sudo update-alternatives --install /usr/bin/c++ c++ $(which clang++) 100
          sudo update-alternatives --set cc $(which clang)
          sudo update-alternatives --set c++ $(which clang++)

          # Same AlmaLinux 8 container as the release pipeline; the dnf
          # branch is a guarded safety net (image ships the packages).
          if command -v dnf >/dev/null 2>&1; then
            if ! rpm -q ccache ninja-build vulkan-loader-devel libsecret-devel libzstd-devel >/dev/null 2>&1; then
              sudo dnf install -y ccache ninja-build vulkan-loader-devel libsecret-devel libzstd-devel
            fi
          else
            sudo apt install ccache ninja-build libvulkan-dev libzstd-dev libsecret-1-dev -y
          fi
          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV

      - name: Provision python3.12
        shell: bash
        run: |
          # EL8 default python3 is 3.6; invoke python3.12 explicitly
          # everywhere (D-12, research Pitfall 4). Ephemeral per job.
          if command -v python3.12 >/dev/null 2>&1; then
            echo "python3.12 already present"
          elif command -v dnf >/dev/null 2>&1; then
            SUDO=""
            command -v sudo >/dev/null 2>&1 && SUDO="sudo"
            $SUDO dnf install -y python3.12
          else
            sudo apt-get update
            sudo apt-get install -y python3.12
          fi
          python3.12 --version

      - name: Capacity probe (runner evidence, research A4)
        shell: bash
        run: |
          # Same probe as the e2e job — log AND summary (API-retrievable).
          free_out="$(free -h 2>/dev/null || echo "free not available")"
          echo "capacity probe: nproc=$(nproc) python=$(python3.12 --version 2>&1)"
          echo "$free_out"
          {
            echo "## Ceremony e2e nightly runner capacity"
            echo
            echo "- nproc: $(nproc)"
            echo "- python: $(python3.12 --version 2>&1)"
            echo
            echo '```'
            echo "$free_out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure CMake for Linux
        working-directory: ${{github.workspace}}/GeniusSDK
        # Pin clang explicitly — see the e2e job's step for the AlmaLinux 8
        # /usr/bin/c++ (g++ 8.5) trap this avoids (Pitfall 5).
        shell: bash
        run: cmake -S build/Linux -B $BUILD_DIRECTORY -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=$(which clang) -DCMAKE_CXX_COMPILER=$(which clang++) -DTHIRDPARTY_BUILD_DIR=${{env.THIRDPARTY_BUILD_DIR}} -DZKLLVM_BUILD_DIR=${{env.ZKLLVM_BUILD_DIR}} -DSUPERGENIUS_DIR=${{env.SUPERGENIUS_DIR}} -DABI_SUBFOLDER_NAME='/x86_64'

      - name: Build GeniusSDK
        working-directory: ${{github.workspace}}/GeniusSDK/${{env.BUILD_DIRECTORY}}
        shell: bash
        run: cmake --build . --config Release -j

      - name: Resolve harness binaries
        shell: bash
        run: |
          RUNNER_BIN="$GITHUB_WORKSPACE/GeniusSDK/${BUILD_DIRECTORY}/services/GeniusSDKService"
          if [ ! -x "$RUNNER_BIN" ]; then
            RUNNER_BIN="$(find "$GITHUB_WORKSPACE/GeniusSDK/build" -type f -name GeniusSDKService -perm -u+x 2>/dev/null | head -n 1)"
          fi
          if [ -z "$RUNNER_BIN" ] || [ ! -x "$RUNNER_BIN" ]; then
            echo "FATAL: GeniusSDKService not found under $GITHUB_WORKSPACE/GeniusSDK/build" >&2
            exit 1
          fi

          SGNS_TRUST_BIN="$SUPERGENIUS_DIR/${BUILD_DIRECTORY}/SuperGenius/bin/sgns-trust"
          if [ ! -x "$SGNS_TRUST_BIN" ]; then
            SGNS_TRUST_BIN="$(find "$SUPERGENIUS_DIR" -type f -name sgns-trust -perm -u+x 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SGNS_TRUST_BIN" ] || [ ! -x "$SGNS_TRUST_BIN" ]; then
            echo "FATAL: sgns-trust not found in the extracted SuperGenius tree ($SUPERGENIUS_DIR)" >&2
            exit 1
          fi

          echo "RUNNER_BIN=$RUNNER_BIN" >> "$GITHUB_ENV"
          echo "SGNS_TRUST_BIN=$SGNS_TRUST_BIN" >> "$GITHUB_ENV"

      - name: Map matrix mode to invocation
        shell: bash
        env:
          MATRIX_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          # ONE home for the mode -> args -> expected-rc mapping (not six
          # copied invocation steps). Harness exit contract: 0 success,
          # 2 stranded negative control with the STRANDED-GENESIS-DETECTED
          # marker, 1 everything else.
          case "$MATRIX_MODE" in
            happy)
              EXTRA_ARGS=""
              EXPECTED_RC=0
              ;;
            restart-mid-ceremony|restart-mid-sync|quorum-loss|window-edge|dht-health)
              EXTRA_ARGS="--scenario $MATRIX_MODE"
              EXPECTED_RC=0
              ;;
            negative-control)
              EXTRA_ARGS="--approve-peers 2"
              EXPECTED_RC=2
              ;;
            *)
              echo "FATAL: unknown nightly matrix mode: $MATRIX_MODE" >&2
              exit 1
              ;;
          esac
          echo "EXTRA_ARGS=$EXTRA_ARGS" >> "$GITHUB_ENV"
          echo "EXPECTED_RC=$EXPECTED_RC" >> "$GITHUB_ENV"
          {
            echo "## Ceremony e2e nightly leg"
            echo
            echo "- mode: $MATRIX_MODE"
            echo "- extra args: ${EXTRA_ARGS:-<none>}"
            echo "- expected exit: $EXPECTED_RC"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run ceremony e2e (matrix leg)
        shell: bash
        env:
          MATRIX_MODE: ${{ matrix.mode }}
        run: |
          # Same dbus-run-session + gnome-keyring wrapper as the e2e job
          # (libsecret needs a secret service; verbatim from SuperGenius's
          # proven ctest step). Values ride the ENVIRONMENT through the
          # wrapper; NO single quotes inside the bash -c body. $EXTRA_ARGS
          # is intentionally unquoted word-splitting of a workflow-generated
          # (never user-supplied) 0-or-2-word string.
          dbus-run-session -- bash -c '\
            mkdir -p ~/.cache ~/.local/share/keyrings && \
            echo -n "login" > ~/.local/share/keyrings/default && \
            echo "[keyring]
            display-name=login
            lock-on-idle=false
            lock-after=false" > ~/.local/share/keyrings/login.keyring && \
            eval $(printf "\n" | gnome-keyring-daemon --unlock --components=secrets) && \
            log="${RUNNER_TEMP:-/tmp}/ceremony-e2e-$MATRIX_MODE.log" && \
            python3.12 "$GITHUB_WORKSPACE/GeniusSDK/e2e/ceremony_e2e.py" --nodes 5 \
              --runner "$RUNNER_BIN" --sgns-trust "$SGNS_TRUST_BIN" $EXTRA_ARGS 2>&1 | tee "$log"
            rc="${PIPESTATUS[0]}"
            echo "CASE $MATRIX_MODE: exit=$rc (expected $EXPECTED_RC)"
            if [ "$rc" -ne "$EXPECTED_RC" ]; then
              echo "FAIL: matrix leg $MATRIX_MODE exited $rc, expected $EXPECTED_RC"
              exit 1
            fi
            if [ "$EXPECTED_RC" -eq 2 ] && ! grep -q "STRANDED-GENESIS-DETECTED" "$log"; then
              echo "FAIL: negative control exited 2 but the STRANDED-GENESIS-DETECTED marker is missing"
              exit 1
            fi'

      - name: Record runner dependency closure (ldd + sha256)
        # Same recorded-digest + closure contract as the e2e job; nightly
        # legs are evidence (no image publish ever rides a nightly run).
        # Same single-dir staging for a flat artifact (see the e2e job's
        # step comment for the LCA/out-of-workspace drop this avoids).
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          stage="$GITHUB_WORKSPACE/runner-stage"
          mkdir -p "$stage"
          cp "$RUNNER_BIN" "$stage/GeniusSDKService"
          {
            ldd "$RUNNER_BIN"
            echo "sha256: $(sha256sum "$RUNNER_BIN" | cut -d' ' -f1)"
          } | tee "$stage/runner-ldd.txt"

      - name: Upload runner binary + dependency closure
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: runner-binary-${{ matrix.mode }}
          path: ${{ github.workspace }}/runner-stage
          if-no-files-found: error
          retention-days: 3

      - name: Upload ceremony e2e failure artifacts
        # Scrubbed-by-contract artifacts directory only (see the e2e job).
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ceremony-e2e-artifacts-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/GeniusSDK/e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup stragglers
        if: always()
        shell: bash
        run: |
          # Guarded pkill — never fail the job from cleanup.
          pkill -x GeniusSDKService 2>/dev/null || true
          pkill -x sgns-trust 2>/dev/null || true

  # The NAS node-runtime image (further-amended D-03, 04-02): build and
  # publish ghcr.io/geniusventures/geniussdk-staging-node ONLY from a green
  # PUSH-shape e2e run — the green gate; never on PR, nightly schedule, or
  # dispatch (no registry churn). Runs on the self-hosted runner WITHOUT the
  # container block: it needs the runner host's own Docker (the same daemon
  # the container jobs proxy through — asserted loudly by the preflight).
  node-image:
    needs: [resolve-runners, e2e]
    if: ${{ github.event_name == 'push' }}
    runs-on: ${{ fromJson(needs.resolve-runners.outputs.linux_x64) }}
    timeout-minutes: 30
    # The ONE job-scoped exception to the workflow's read-only default
    # (see the header comment): short-lived GITHUB_TOKEN for the ghcr push.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Docker preflight (host daemon + CLI)
        shell: bash
        run: |
          set -euo pipefail
          docker version

      - name: Checkout GeniusSDK (deploy tree)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: "GeniusSDK"

      - name: Login to ghcr.io (pull credential) + explicit base pull
        # GNUS_TOKEN_1 — the proven base-image puller (same credential the
        # container jobs use). Pulling the base explicitly makes base-image
        # failures loud and attributable before any build work happens.
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GNUS_TOKEN_1 }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/geniusventures/almalinux-8:latest

      - name: Login to ghcr.io (push credential)
        # The job's short-lived GITHUB_TOKEN with packages:write — no
        # long-lived PAT in the push path (T-04-02-06). If the org restricts
        # package creation this push fails closed; the fix is an org
        # Packages-settings grant, never a wider token.
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Download runner binary artifact
        uses: actions/download-artifact@v8
        with:
          name: runner-binary

      - name: Stage + verify the runner binary
        # Re-verify sha256 against the e2e job's recorded digest
        # (T-04-02-02 — integrity via the recorded sha256, download only
        # from the known green run), then stage at the Dockerfile's expected
        # context layout (deploy/nas/GeniusSDKService).
        shell: bash
        run: |
          set -euo pipefail
          chmod +x GeniusSDKService
          actual="$(sha256sum GeniusSDKService | cut -d' ' -f1)"
          recorded="$(sed -n 's/^sha256: //p' runner-ldd.txt)"
          if [ -z "$recorded" ] || [ "$actual" != "$recorded" ]; then
            echo "FATAL: runner sha256 $actual != recorded ${recorded:-<none>}" >&2
            exit 1
          fi
          mv GeniusSDKService GeniusSDK/deploy/nas/GeniusSDKService
          {
            echo "## Staging node image inputs"
            echo
            echo "- runner sha256: $actual"
            echo "- e2e green-gate commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the node image
        shell: bash
        run: |
          set -euo pipefail
          cd GeniusSDK/deploy
          docker build -f nas/Dockerfile \
            -t ghcr.io/geniusventures/geniussdk-staging-node:staging \
            -t "ghcr.io/geniusventures/geniussdk-staging-node:${{ github.sha }}" .

      - name: Pre-push gate - ldd closure inside the image
        # The strongest verification point (Pitfall 8's cousin): the closure
        # is checked INSIDE the assembled image, after the dnf runtime layer,
        # before anything reaches the registry. Zero "not found" entries or
        # the image is never pushed.
        shell: bash
        run: |
          set -euo pipefail
          missing="$(docker run --rm --entrypoint /usr/bin/bash \
            ghcr.io/geniusventures/geniussdk-staging-node:staging \
            -c 'ldd /usr/local/bin/GeniusSDKService | grep "not found" || true')"
          if [ -n "$missing" ]; then
            echo "FATAL: unresolved shared libraries inside the image:" >&2
            echo "$missing" >&2
            exit 1
          fi
          echo "in-image ldd gate: zero not-found entries"

      - name: Push the node image
        shell: bash
        run: |
          set -euo pipefail
          push_log="$(mktemp)"
          docker push ghcr.io/geniusventures/geniussdk-staging-node:staging \
            2>&1 | tee "$push_log"
          docker push "ghcr.io/geniusventures/geniussdk-staging-node:${{ github.sha }}" \
            2>&1 | tee -a "$push_log"
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' "$push_log" | head -n 1)"
          if [ -z "$digest" ]; then
            echo "FATAL: no digest parsed from the push output" >&2
            exit 1
          fi
          {
            echo "## Published staging node image"
            echo
            echo "- tags: staging, ${{ github.sha }}"
            echo "- digest: $digest"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          echo "NODE_IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

  # The external-joiner proof (D-02b, 05-02 Task 1 / SCEN-01's artifact half):
  # a GitHub-HOSTED clean machine — no resolve-runners, no EL8 build
  # container; the published image IS the runtime (D-02's hosted lock) —
  # fetches the canonical develop artifact pair, boots the keyless container
  # joiner (D-11 wrapper mode), and gates on READY with head==genesis_cid as
  # auxiliary corroboration (D-01: READY is the join proof, never "syncs to
  # head" framing). Deliberate dispatch only (CI-01 spirit); read-only
  # participation (no key, no mint/transfer surface); no repo secrets —
  # public raw URLs, anonymous ghcr pull, and the ambient GITHUB_TOKEN used
  # solely to read the provenance lineage below.
  staging-join:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'staging-join' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # gh run download of the publishing run's runner-binary artifact
      # (the provenance byte-match below) — read-only, ambient token.
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout GeniusSDK (topology.py at the dispatch ref)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Fetch the canonical artifact pair + fingerprint assert (JOIN.md §2)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging-net
          curl -fsSL -o staging-net/staging-net.json \
            https://raw.githubusercontent.com/GeniusVentures/GeniusSDK/develop/deploy/staging-net/staging-net.json
          curl -fsSL -o staging-net/manifest.bin \
            https://raw.githubusercontent.com/GeniusVentures/GeniusSDK/develop/deploy/staging-net/manifest.bin
          recorded="$(jq -r .ceremony_fingerprint staging-net/staging-net.json)"
          actual="$(sha256sum staging-net/manifest.bin | cut -d' ' -f1)"
          if [ -z "$recorded" ] || [ "$actual" != "$recorded" ]; then
            echo "FATAL: sha256(manifest.bin) $actual != ceremony_fingerprint ${recorded:-<none>} — re-fetch the artifact set before anything else (JOIN.md troubleshooting)" >&2
            exit 1
          fi
          echo "artifact fingerprint verified: $actual"

      - name: Generate the joiner bundle (topology.py --join)
        shell: bash
        run: |
          set -euo pipefail
          python3 e2e/topology.py --join staging-net --out-dir joiners --count 1
          net_id="$(jq -r .net_id joiners/joiner1/sgns_config.json)"
          if [ "$net_id" != "333" ]; then
            echo "FATAL: joiner sgns_config net_id=$net_id != 333 (staging pin)" >&2
            exit 1
          fi
          tm="$(jq -r .loggers.TransactionManager joiners/joiner1/log_config.json)"
          if [ "$tm" != "info" ]; then
            echo "FATAL: joiner log_config TransactionManager=$tm != info — the dispatched ref predates 05-01's D-09 promotion" >&2
            exit 1
          fi
          echo "joiner bundle: net_id=333, TransactionManager=info (D-09)"

      - name: Docker preflight + pull the staging image
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker pull ghcr.io/geniusventures/geniussdk-staging-node:staging
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' \
            ghcr.io/geniusventures/geniussdk-staging-node:staging | cut -d'@' -f2)"
          if [ -z "$digest" ]; then
            echo "FATAL: no digest resolved for the pulled :staging image" >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          {
            echo "## staging-join (hosted keyless joiner, D-02b)"
            echo
            echo "- image digest: $digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Image provenance asserts (wrapper freshness + runner lineage)
        # T-05-02-02. The wrapper grep is the 05-01 republish gate: the
        # optional-key assignment reaches the registry only through a green
        # push run's node-image job — its absence means the republish has
        # not landed (wait for it; the entrypoint-bypass is the documented
        # fallback, never silently switched here). The runner byte-match
        # compares the in-image binary against the runner-binary artifact of
        # the LATEST GREEN PUSH run — the exact CI lineage that published
        # :staging. The artifact's runner_sha256 field pins the FLEET's
        # runner (JOIN.md §2: the sync gate, not a byte match, proves a
        # join); fleet pin and CI lineage legitimately diverged when the
        # post-artifact signal-lifetime fixes (e3fff7e/b192165) rebuilt the
        # runner — both values are recorded beside each other as the
        # fleet-vs-joiner skew, and only the lineage match is a gate.
        shell: bash
        run: |
          set -euo pipefail
          if ! docker run --rm --entrypoint /usr/bin/bash \
              ghcr.io/geniusventures/geniussdk-staging-node:staging \
              -c 'grep -q "GENIUSSDK_KEY_FILE:-" /usr/local/bin/sgns-node-wrap.sh'; then
            echo "FATAL: in-image wrapper lacks the optional-key assignment (GENIUSSDK_KEY_FILE:-) — the 05-01 push's node-image republish has not landed; wait for its green node-image job before dispatching" >&2
            exit 1
          fi
          publish_run="$(gh run list --workflow ceremony-e2e.yml --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$publish_run" ] || [ "$publish_run" = "null" ]; then
            echo "FATAL: no successful push run found to source the runner lineage" >&2
            exit 1
          fi
          echo "runner lineage: runner-binary artifact of green push run $publish_run"
          gh run download "$publish_run" -n runner-binary -D runner-lineage
          expected="$(sed -n 's/^sha256: //p' runner-lineage/runner-ldd.txt)"
          actual="$(docker run --rm --entrypoint /usr/bin/bash \
            ghcr.io/geniusventures/geniussdk-staging-node:staging \
            -c 'sha256sum /usr/local/bin/GeniusSDKService' | cut -d' ' -f1)"
          fleet_pin="$(jq -r .runner_sha256 staging-net/staging-net.json)"
          echo "in-image runner sha256:    $actual"
          echo "CI lineage runner sha256:  $expected (push run $publish_run)"
          echo "artifact fleet pin:        $fleet_pin (informational skew, JOIN.md §2)"
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "FATAL: in-image runner sha256 $actual != CI lineage ${expected:-<none>} — the pulled :staging image is not the latest green push build" >&2
            exit 1
          fi
          {
            echo "- in-image runner sha256: $actual (== CI lineage, push run $publish_run)"
            echo "- artifact fleet runner pin: $fleet_pin (recorded skew, not a gate)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Boot the keyless joiner container (D-11 shape)
        shell: bash
        run: |
          set -euo pipefail
          # NO GENIUSSDK_KEY_FILE: the joiner is a fresh account (every real
          # joiner's shape). IPC_LOCK mirrors the image's own runtime notes.
          docker run -d --name staging-joiner --cap-add IPC_LOCK \
            -e GENIUSSDK_BIN=/usr/local/bin/GeniusSDKService \
            -e GENIUSSDK_BASE=/data/joiner1/ \
            -e HOME=/data/joiner1 \
            -v "$PWD/joiners/joiner1:/data/joiner1" \
            ghcr.io/geniusventures/geniussdk-staging-node:staging
          sleep 5
          docker ps --filter name=staging-joiner --format 'table {{.Names}}\t{{.Status}}'

      - name: READY gate + auxiliary head==genesis_cid gate (JOIN.md §6)
        shell: bash
        run: |
          set -euo pipefail
          genesis_cid="$(jq -r .genesis_cid staging-net/staging-net.json)"
          ready_at=""
          deadline=$((SECONDS + 480))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if docker logs staging-joiner 2>&1 | grep -q "node_state=READY"; then
              ready_at="$(date -u +%FT%TZ)"
              break
            fi
            sleep 15
          done
          docker logs staging-joiner > joiner.log 2>&1
          if [ -z "$ready_at" ]; then
            echo "FATAL: joiner never reported node_state=READY within 8 min (norm ~2 min per JOIN.md §6; INITIALIZING_BLOCKCHAIN 60-90s is normal, not stuck)" >&2
            exit 1
          fi
          head_count="$(grep -oE 'head=[A-Za-z0-9]+' joiner.log | sort -u | wc -l | tr -d ' ')"
          head_value="$(grep -oE 'head=[A-Za-z0-9]+' joiner.log | sort -u | head -1)"
          if [ "$head_count" != "1" ] || [ "$head_value" != "head=$genesis_cid" ]; then
            echo "FATAL: auxiliary head gate — sampled head values must be exactly head=$genesis_cid, got $head_count distinct value(s): $head_value" >&2
            exit 1
          fi
          echo "READY at $ready_at UTC; head samples == genesis_cid ($genesis_cid, auxiliary corroboration — READY is the join proof per D-01)"
          echo "READY_AT=$ready_at" >> "$GITHUB_ENV"
          {
            echo "- READY at: $ready_at UTC"
            echo "- head samples == genesis_cid: $genesis_cid (auxiliary, D-01)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: READY stability (dry) or the 30-min liveness window (liveness=true)
        # The dry shape (this plan) proves the machinery green with a 5-min
        # READY-stability check; liveness=true is 05-04's witnessed window —
        # 30 samples of the D-09 'Tracking entry confirmed' count, one per
        # minute, failing loudly unless the count grows 0 -> >=2.
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.liveness }}" = "true" ]; then
            : > liveness.log
            first=""
            last=""
            for i in $(seq 1 30); do
              sleep 60
              if [ "$(docker inspect --format '{{.State.Running}}' staging-joiner 2>/dev/null || echo false)" != "true" ]; then
                echo "FATAL: liveness window — the joiner container exited at sample $i" >&2
                exit 1
              fi
              ts="$(date -u +%FT%TZ)"
              stdout_count="$(docker logs staging-joiner 2>&1 | grep -c 'Tracking entry confirmed' || true)"
              file_count=0
              if docker exec staging-joiner test -f /data/joiner1/sgnslog2.log 2>/dev/null; then
                file_count="$(docker exec staging-joiner grep -c 'Tracking entry confirmed' /data/joiner1/sgnslog2.log 2>/dev/null || true)"
              fi
              echo "LIVENESS $ts stdout_count=$stdout_count file_count=$file_count" | tee -a liveness.log
              if [ -z "$first" ]; then first="$stdout_count"; fi
              last="$stdout_count"
            done
            if [ "$first" != "0" ] || [ "$last" -lt 2 ]; then
              echo "FATAL: liveness gate — the count must grow from a first sample of 0 to a last sample >= 2 (a no-growth run is a red build by design; re-dispatch with the witnessed transfer procedure); full series:" >&2
              cat liveness.log >&2
              exit 1
            fi
            echo "liveness window: count grew 0 -> $last across 30 samples (D-12)"
            {
              echo "- liveness window: first=0 last=$last"
              echo '```'
              cat liveness.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            deadline=$((SECONDS + 300))
            while [ "$SECONDS" -lt "$deadline" ]; do
              sleep 60
              if [ "$(docker inspect --format '{{.State.Running}}' staging-joiner 2>/dev/null || echo false)" != "true" ]; then
                echo "FATAL: READY-stability check — the joiner container exited" >&2
                exit 1
              fi
              state="$(docker logs staging-joiner 2>&1 | grep -oE 'node_state=[A-Z_]+' | tail -1 || true)"
              if [ -n "$state" ] && [ "$state" != "node_state=READY" ]; then
                echo "FATAL: READY-stability check — last observed state $state" >&2
                exit 1
              fi
              if docker logs staging-joiner 2>&1 | grep -q 'FATAL'; then
                echo "FATAL: READY-stability check — FATAL line in the joiner log" >&2
                exit 1
              fi
            done
            echo "READY-stability: state held READY across the 5-minute window, zero FATAL lines"
            echo "- READY stability: held 5 min, zero FATAL lines (dry shape; liveness=false)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage evidence + remove the joiner container
        # ONE flat dir (the 04-02 LCA lesson): upload-artifact stores paths
        # relative to the least-common-ancestor — nested/multi-root uploads
        # silently lose files.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          docker logs staging-joiner > evidence/joiner.log 2>&1 || true
          if [ -f liveness.log ]; then cp liveness.log evidence/; fi
          if [ -f joiners/joiner1/sgns_config.json ]; then cp joiners/joiner1/sgns_config.json evidence/; fi
          if [ -f joiners/joiner1/log_config.json ]; then cp joiners/joiner1/log_config.json evidence/; fi
          if [ -f joiners/joiner1/sgnslog2.log ]; then cp joiners/joiner1/sgnslog2.log evidence/; fi
          docker rm -f staging-joiner > /dev/null 2>&1 || true

      - name: Upload joiner evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-join-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14

  # The wrong-net refusal leg (D-05 leg 1, 05-02 Task 2 / NET-03): the SAME
  # hosted keyless-joiner shape with net_id deliberately flipped to 144
  # (subnet_id untouched — Pitfall 1's two knobs), refused per D-07's locked
  # operational definition: never READY, the blockchain retry pair still
  # recurring at the end of a 12-minute bound, and no head= line ever. The
  # retry pair is EXPECTED noise during healthy joins (Pitfall 5) — presence
  # proves nothing; persistence plus never-READY is the proof.
  staging-refuse-net:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'staging-refuse' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout GeniusSDK (topology.py at the dispatch ref)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Fetch the canonical artifact pair + fingerprint assert (JOIN.md §2)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging-net
          curl -fsSL -o staging-net/staging-net.json \
            https://raw.githubusercontent.com/GeniusVentures/GeniusSDK/develop/deploy/staging-net/staging-net.json
          curl -fsSL -o staging-net/manifest.bin \
            https://raw.githubusercontent.com/GeniusVentures/GeniusSDK/develop/deploy/staging-net/manifest.bin
          recorded="$(jq -r .ceremony_fingerprint staging-net/staging-net.json)"
          actual="$(sha256sum staging-net/manifest.bin | cut -d' ' -f1)"
          if [ -z "$recorded" ] || [ "$actual" != "$recorded" ]; then
            echo "FATAL: sha256(manifest.bin) $actual != ceremony_fingerprint ${recorded:-<none>} — re-fetch the artifact set before anything else (JOIN.md troubleshooting)" >&2
            exit 1
          fi
          echo "artifact fingerprint verified: $actual"

      - name: Generate the joiner bundle (topology.py --join)
        shell: bash
        run: |
          set -euo pipefail
          python3 e2e/topology.py --join staging-net --out-dir joiners --count 1
          net_id="$(jq -r .net_id joiners/joiner1/sgns_config.json)"
          if [ "$net_id" != "333" ]; then
            echo "FATAL: pre-mutation joiner sgns_config net_id=$net_id != 333 (staging pin)" >&2
            exit 1
          fi
          echo "joiner bundle generated: net_id=333 (about to be deliberately mismatched)"

      - name: "Apply the deliberate net_id=144 mismatch (Pitfall 1: net_id ONLY)"
        # A harness mutation of the locally generated sgns_config.json —
        # never a writer change. subnet_id is the manifest knob and must
        # stay pinned at 333; network_config.json stays untouched.
        shell: bash
        run: |
          set -euo pipefail
          jq '.net_id=144' joiners/joiner1/sgns_config.json > sgns-mutated.json
          mv sgns-mutated.json joiners/joiner1/sgns_config.json
          net_id="$(jq -r .net_id joiners/joiner1/sgns_config.json)"
          subnet_id="$(jq -r .subnet_id joiners/joiner1/sgns_config.json)"
          if [ "$net_id" != "144" ]; then
            echo "FATAL: mutated net_id=$net_id != 144" >&2
            exit 1
          fi
          if [ "$subnet_id" != "333" ]; then
            echo "FATAL: subnet_id=$subnet_id != 333 — the manifest knob must stay pinned (Pitfall 1: two knobs, one flipped)" >&2
            exit 1
          fi
          echo "mismatch applied: net_id=144, subnet_id=$subnet_id, network_config.json untouched"

      - name: Docker preflight + pull the staging image
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker pull ghcr.io/geniusventures/geniussdk-staging-node:staging
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' \
            ghcr.io/geniusventures/geniussdk-staging-node:staging | cut -d'@' -f2)"
          if [ -z "$digest" ]; then
            echo "FATAL: no digest resolved for the pulled :staging image" >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          {
            echo "## staging-refuse-net (net_id 144 leg, D-07)"
            echo
            echo "- image digest: $digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Image provenance asserts (wrapper freshness + runner lineage)
        # Same gate as staging-join (T-05-02-02): see that job's step comment
        # for the lineage-vs-fleet-pin rationale.
        shell: bash
        run: |
          set -euo pipefail
          if ! docker run --rm --entrypoint /usr/bin/bash \
              ghcr.io/geniusventures/geniussdk-staging-node:staging \
              -c 'grep -q "GENIUSSDK_KEY_FILE:-" /usr/local/bin/sgns-node-wrap.sh'; then
            echo "FATAL: in-image wrapper lacks the optional-key assignment (GENIUSSDK_KEY_FILE:-) — the 05-01 push's node-image republish has not landed; wait for its green node-image job before dispatching" >&2
            exit 1
          fi
          publish_run="$(gh run list --workflow ceremony-e2e.yml --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$publish_run" ] || [ "$publish_run" = "null" ]; then
            echo "FATAL: no successful push run found to source the runner lineage" >&2
            exit 1
          fi
          gh run download "$publish_run" -n runner-binary -D runner-lineage
          expected="$(sed -n 's/^sha256: //p' runner-lineage/runner-ldd.txt)"
          actual="$(docker run --rm --entrypoint /usr/bin/bash \
            ghcr.io/geniusventures/geniussdk-staging-node:staging \
            -c 'sha256sum /usr/local/bin/GeniusSDKService' | cut -d' ' -f1)"
          fleet_pin="$(jq -r .runner_sha256 staging-net/staging-net.json)"
          echo "in-image runner sha256:    $actual"
          echo "CI lineage runner sha256:  $expected (push run $publish_run)"
          echo "artifact fleet pin:        $fleet_pin (informational skew, JOIN.md §2)"
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "FATAL: in-image runner sha256 $actual != CI lineage ${expected:-<none>} — the pulled :staging image is not the latest green push build" >&2
            exit 1
          fi
          {
            echo "- in-image runner sha256: $actual (== CI lineage, push run $publish_run)"
            echo "- artifact fleet runner pin: $fleet_pin (recorded skew, not a gate)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Boot the keyless 144 joiner container (D-11 shape)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name staging-refuse-net --cap-add IPC_LOCK \
            -e GENIUSSDK_BIN=/usr/local/bin/GeniusSDKService \
            -e GENIUSSDK_BASE=/data/joiner1/ \
            -e HOME=/data/joiner1 \
            -v "$PWD/joiners/joiner1:/data/joiner1" \
            ghcr.io/geniusventures/geniussdk-staging-node:staging
          sleep 5
          docker ps --filter name=staging-refuse-net --format 'table {{.Names}}\t{{.Status}}'

      - name: "Refusal gate (D-07: never-READY + persistent retry pair + no head, 12-min bound)"
        # 12 minutes is >> the ~2 min healthy-join norm (Pitfall 5): the
        # retry pair recurs during healthy joins too, so only persistence
        # across the bound PLUS never-READY PLUS zero head= lines is the
        # refusal proof. The one-third-vs-end comparison guards against a
        # joiner that gave up mid-bound (a stopped retry is NOT a refusal).
        shell: bash
        run: |
          set -euo pipefail
          : > refuse-samples.log
          counts=()
          for i in $(seq 1 12); do
            sleep 60
            if [ "$(docker inspect --format '{{.State.Running}}' staging-refuse-net 2>/dev/null || echo false)" != "true" ]; then
              docker logs staging-refuse-net > joiner.log 2>&1 || true
              echo "FATAL: the 144 joiner container exited at sample $i — not the expected persistent-retry refusal shape" >&2
              exit 1
            fi
            ts="$(date -u +%FT%TZ)"
            retries="$(docker logs staging-refuse-net 2>&1 | grep -c 'Scheduling blockchain retry after failure' || true)"
            echo "REFUSE $ts retries=$retries" | tee -a refuse-samples.log
            counts+=("$retries")
          done
          docker logs staging-refuse-net > joiner.log 2>&1
          third="${counts[3]}"
          last="${counts[11]}"
          if [ "$last" -le "$third" ]; then
            echo "FATAL: the retry pair stopped recurring between the one-third mark (retries=$third) and the end (retries=$last) — persistence plus never-READY is the D-07 proof" >&2
            exit 1
          fi
          if grep -q 'node_state=READY' joiner.log; then
            echo "FATAL: HALF-JOIN-DETECTED — node_state=READY observed on the net_id 144 joiner" >&2
            exit 1
          fi
          if grep -q 'head=' joiner.log; then
            echo "FATAL: a head= line was observed on the net_id 144 joiner" >&2
            exit 1
          fi
          echo "refusal proven per D-07: retries $third -> $last (still recurring at the bound), zero node_state=READY, zero head="
          # Corroborating, NOT a hard gate: TrustStateStore keys are
          # RocksDB-interior; the quarantined joiner exchanged nothing
          # (topic-appendix segregation, RQ4) so no trust writes occurred.
          # The base dir is discarded with the runner workspace.
          find joiners/joiner1 -maxdepth 2 | sort | tee refuse-baseir.log || true
          {
            echo "- retry pair: $third -> $last across the 12-min bound (still recurring)"
            echo "- node_state=READY lines: 0; head= lines: 0"
            echo "- base dir listing: recorded in refuse-baseir.log (corroborating)"
            echo '```'
            cat refuse-samples.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage evidence + remove the joiner container
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          docker logs staging-refuse-net > evidence/joiner.log 2>&1 || true
          if [ -f refuse-samples.log ]; then cp refuse-samples.log evidence/; fi
          if [ -f refuse-baseir.log ]; then cp refuse-baseir.log evidence/; fi
          if [ -f joiners/joiner1/sgns_config.json ]; then cp joiners/joiner1/sgns_config.json evidence/sgns_config.mutated-144.json; fi
          if [ -f joiners/joiner1/log_config.json ]; then cp joiners/joiner1/log_config.json evidence/; fi
          if [ -f joiners/joiner1/sgnslog2.log ]; then cp joiners/joiner1/sgnslog2.log evidence/; fi
          docker rm -f staging-refuse-net > /dev/null 2>&1 || true

      - name: Upload refusal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-refuse-net-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14

  # The session-binary source build (05-03 Task 1 / D-08's driver): node_example
  # exists in NO tarball (no install rule; this workflow otherwise consumes the
  # prebuilt SuperGenius install tree), so a clean DEVELOP source build of the
  # SuperGenius tree produces it — the SAME EL8 container + thirdparty/zkLLVM
  # release chain the e2e job uses, with the prebuilt Download SuperGenius step
  # REPLACED by a source checkout at develop. NO version sed here: this must be
  # the true develop build the witnessed session runs (the 3.6 franken-build is
  # staging-refuse-version's leg, never this one). Deliberate dispatch only;
  # touches nothing on the VPS, the published artifact set, or the registry.
  staging-session-bin:
    needs: resolve-runners
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'staging-session-bin' }}
    runs-on: ${{ fromJson(needs.resolve-runners.outputs.linux_x64) }}
    timeout-minutes: 240
    env:
      GRPC_BUILD_ENABLE_CCACHE: "ON"
      GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
    container:
      image: ghcr.io/geniusventures/almalinux-8:latest
      # IPC_LOCK mirrors the e2e job's container block (copied verbatim): EL8's
      # gnome-keyring-daemon carries file capabilities, and exec of a file-caps
      # binary in a container whose bounding set lacks the cap returns EPERM.
      options: --cap-add=IPC_LOCK
      credentials:
        username: ${{github.actor}}
        password: ${{secrets.GNUS_TOKEN_1}}
    steps:
      - name: Clean workspace (self-hosted runners)
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          # Container jobs leave root-owned build trees behind; clear the four
          # build-input dirs so this job's downloads/checkouts start clean
          # (the e2e job's cleanup step, same guards).
          SUDO=""
          if [ "$(uname)" = "Linux" ]; then
            SUDO="sudo"
          fi
          for dir in thirdparty zkLLVM SuperGenius GeniusSDK; do
            if [ -d "$dir" ]; then
              echo "Removing $dir directory..."
              $SUDO rm -rf "$dir"
            fi
          done

      - name: Set build directory
        shell: bash
        run: |
          # Same abi-suffixed layout as the e2e job: the thirdparty/zkLLVM
          # tarballs extract to build/Linux/Release/x86_64 and the SuperGenius
          # source build below points its dependency overrides at the same
          # shape.
          BUILD_DIRECTORY=build/Linux/Release/x86_64
          echo "BUILD_DIRECTORY=$BUILD_DIRECTORY" >> $GITHUB_ENV

      - name: Download thirdparty release
        working-directory: ${{github.workspace}}
        shell: bash
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.pull_request.head.ref }}
        run: |
          # Determine current branch or tag
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${GITHUB_EVENT_INPUTS_TAG}" ]; then
            CURRENT_BRANCH="${GITHUB_EVENT_INPUTS_TAG}"
            IS_TAG=true
          elif ${{github.event_name == 'pull_request'}}; then
            CURRENT_BRANCH=${GITHUB_EVENT_PULL_REQUEST_HEAD_REF}
            IS_TAG=false
          else
            CURRENT_BRANCH=$GITHUB_REF_NAME
            IS_TAG=false
          fi

          echo "Identified current branch/tag as ${CURRENT_BRANCH}"
          echo "CURRENT_BRANCH=${CURRENT_BRANCH}" >>$GITHUB_ENV
          echo "IS_TAG=${IS_TAG}" >>$GITHUB_ENV

          # Determine thirdparty branch to use
          if [ "$IS_TAG" == "true" ]; then
            thirdparty_branch="$CURRENT_BRANCH"
          elif [ "$CURRENT_BRANCH" == "main" ]; then
            thirdparty_branch="main"
          else
            thirdparty_branch="develop"
          fi

          echo "Using ${thirdparty_branch} for thirdparty"

          FILE_NAME=Linux-x86_64-Release.tar.gz
          echo "FILE_NAME=${FILE_NAME}" >> $GITHUB_ENV

          mkdir thirdparty
          cd thirdparty

          if [ "$IS_TAG" == "true" ]; then
            tag_name="${thirdparty_branch}"
          else
            tag_name="Linux-x86_64-${thirdparty_branch}-Release"
          fi

          gh release download ${tag_name} --repo GeniusVentures/thirdparty -p "${FILE_NAME}"
          tar -zxf "${FILE_NAME}"

          echo "THIRDPARTY_BUILD_DIR=$(pwd)/${BUILD_DIRECTORY}" >> $GITHUB_ENV

      - name: Download zkLLVM release
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          # Use same branch determination logic for zkLLVM
          if [ "$IS_TAG" == "true" ]; then
            zkLLVM_branch="$CURRENT_BRANCH"
          elif [ "$CURRENT_BRANCH" == "main" ]; then
            zkLLVM_branch="main"
          else
            zkLLVM_branch="develop"
          fi

          mkdir zkLLVM
          cd zkLLVM

          ZKLLVM_FILE_NAME=Linux-x86_64-Release.tar.gz
          ZKLLVM_BUILD_DIR=${BUILD_DIRECTORY}
          if [ "$IS_TAG" == "true" ]; then
            tag_name="${zkLLVM_branch}"
          else
            tag_name="Linux-x86_64-${zkLLVM_branch}-Release"
          fi

          gh release download ${tag_name} --repo GeniusVentures/zkLLVM -p "${ZKLLVM_FILE_NAME}"

          tar --exclude='*bin/assigner' --exclude='*bin/clang-zkllvm' --exclude='*bin/llvm-link-zkllvm' --exclude='*bin/transpiler' -zxf "${ZKLLVM_FILE_NAME}"

          echo "ZKLLVM_BUILD_DIR=$(pwd)/${ZKLLVM_BUILD_DIR}" >> $GITHUB_ENV

      - name: Checkout SuperGenius source at develop
        # The step that REPLACES the e2e job's prebuilt Download SuperGenius:
        # node_example has no install rule, so the session binary must come
        # from a SOURCE build. develop is the canonical branch (SuperGenius
        # publishes releases only from develop/main); the exact commit is
        # recorded below and rides the artifact chain.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: GeniusVentures/SuperGenius
          ref: develop
          path: SuperGenius
          submodules: "recursive"
          token: ${{ secrets.GNUS_TOKEN_1 }}
          persist-credentials: false

      - name: Record the source SHA + no-sed integrity gate
        # This job must build develop VERBATIM — the fake-old 3.6 sed lives
        # ONLY in the staging-refuse-version leg. Gate the source (and the
        # configure log, later) on the absence of 3.6.0.
        shell: bash
        run: |
          set -euo pipefail
          SGNS_SOURCE_SHA="$(git -C SuperGenius rev-parse HEAD)"
          echo "SGNS_SOURCE_SHA=$SGNS_SOURCE_SHA" >> "$GITHUB_ENV"
          if grep -q '3\.6\.0' SuperGenius/cmake/version.cmake; then
            echo "FATAL: SuperGenius develop cmake/version.cmake carries 3.6.0 — refusing to pass a stale/sedded tree off as the clean session binary" >&2
            exit 1
          fi
          echo "SuperGenius develop source: $SGNS_SOURCE_SHA"
          grep '^set(PROJECT_VERSION' SuperGenius/cmake/version.cmake

      - name: Configure Linux host
        if: ${{ runner.os == 'Linux'}}
        run: |
          sudo update-alternatives --install /usr/bin/cc cc $(which clang) 100
          sudo update-alternatives --install /usr/bin/c++ c++ $(which clang++) 100
          sudo update-alternatives --set cc $(which clang)
          sudo update-alternatives --set c++ $(which clang++)

          # The e2e job's package set (ccache/ninja/vulkan-loader/libsecret/
          # libzstd) plus the source-build additions the SuperGenius release
          # workflow installs (vulkan-headers, perl-IPC-Cmd for OpenSSL's
          # Configure). The image ships most of these; the dnf branch is the
          # guarded safety net.
          if command -v dnf >/dev/null 2>&1; then
            if ! rpm -q ccache ninja-build vulkan-loader-devel vulkan-headers libsecret-devel libzstd-devel which perl perl-IPC-Cmd >/dev/null 2>&1; then
              sudo dnf install -y ccache ninja-build vulkan-loader-devel vulkan-headers libsecret-devel libzstd-devel which perl perl-IPC-Cmd
            fi
          else
            sudo apt install ccache ninja-build libvulkan-dev libzstd-dev libsecret-1-dev -y
          fi
          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV

      - name: Install bindgen + wasm Rust target
        # Unconditional source-build steps from SuperGenius's
        # build-release-tags.yml (the source-build reference this job
        # mirrors): cbindgen drives the header codegen and the wasm target is
        # required by the processing toolchain.
        run: |
          cargo install cbindgen
          rustup target add wasm32-unknown-emscripten

      - name: Configure CMake for the SuperGenius source build
        working-directory: ${{ github.workspace }}/SuperGenius
        shell: bash
        run: |
          set -euo pipefail
          # The exact Linux-leg invocation of build-release-tags.yml (clang
          # pinned against the g++ 8.5 trap, SGNS_NETWORK=release,
          # THIRDPARTY_DIR/BUILD_DIR + ZKLLVM_DIR/BUILD_DIR against the
          # downloaded releases, abi subfolder) — tee'd so the configure log
          # is a gate-able record.
          cmake -S build/Linux -B "$BUILD_DIRECTORY" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSGNS_NETWORK=release \
            -DCMAKE_C_COMPILER="$(which clang)" \
            -DCMAKE_CXX_COMPILER="$(which clang++)" \
            -DTHIRDPARTY_DIR="$GITHUB_WORKSPACE/thirdparty" \
            -DTHIRDPARTY_BUILD_DIR="$THIRDPARTY_BUILD_DIR" \
            -DZKLLVM_DIR="$ZKLLVM_BUILD_DIR" \
            -DZKLLVM_BUILD_DIR="$ZKLLVM_BUILD_DIR" \
            -DABI_SUBFOLDER_NAME=x86_64 \
            2>&1 | tee "$GITHUB_WORKSPACE/supergenius-configure.log"

      - name: Build node_example (pulls genius_node)
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          # Only the session binary's dependency closure — the install rules
          # (the release workflow's full build) are this job's non-goal.
          cmake --build . --config Release --target node_example -j

      - name: "Resolve node_example + ldd gate + no-3.6 configure-log gate"
        shell: bash
        run: |
          set -euo pipefail
          NODE_EXAMPLE_BIN="$GITHUB_WORKSPACE/SuperGenius/${BUILD_DIRECTORY}/example/node_test/node_example"
          if [ ! -x "$NODE_EXAMPLE_BIN" ]; then
            NODE_EXAMPLE_BIN="$(find "$GITHUB_WORKSPACE/SuperGenius/${BUILD_DIRECTORY}" -type f -name node_example -perm -u+x 2>/dev/null | head -n 1)"
          fi
          if [ -z "$NODE_EXAMPLE_BIN" ] || [ ! -x "$NODE_EXAMPLE_BIN" ]; then
            echo "FATAL: node_example not found under the SuperGenius build tree" >&2
            exit 1
          fi
          echo "NODE_EXAMPLE_BIN=$NODE_EXAMPLE_BIN" >> "$GITHUB_ENV"

          # The node-image job's own check shape: ldd runs in the SAME EL8
          # container that built the binary, so the closure is the real
          # runtime dependency set the VPS gate re-verifies.
          missing="$(ldd "$NODE_EXAMPLE_BIN" | grep "not found" || true)"
          if [ -n "$missing" ]; then
            echo "FATAL: unresolved shared libraries:" >&2
            echo "$missing" >&2
            exit 1
          fi

          if grep -q 'PROJECT_VERSION: 3\.6\.0' "$GITHUB_WORKSPACE/supergenius-configure.log"; then
            echo "FATAL: the configure log carries PROJECT_VERSION 3.6.0 — a sed reached this clean-build leg" >&2
            exit 1
          fi
          grep -- '-- PROJECT_VERSION' "$GITHUB_WORKSPACE/supergenius-configure.log" || true
          echo "node_example: $NODE_EXAMPLE_BIN"
          echo "ldd gate: zero not-found entries"

      - name: Stage the session binary flat + record provenance
        # ONE flat dir (the 04-02 LCA lesson: upload-artifact stores paths
        # relative to the least-common ancestor and drops files outside the
        # workspace). The sha256 goes to BOTH the log and the step summary —
        # the summary is not API-retrievable, the log is (the capacity-probe
        # precedent), and the VPS provisioning step verifies its download
        # against this value.
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          stage="$GITHUB_WORKSPACE/session-bin-stage"
          mkdir -p "$stage"
          cp "$NODE_EXAMPLE_BIN" "$stage/node_example"
          sha="$(sha256sum "$stage/node_example" | cut -d' ' -f1)"
          echo "NODE_EXAMPLE_SHA256=$sha" >> "$GITHUB_ENV"
          {
            ldd "$stage/node_example"
            echo "sha256: $sha"
            echo "supergenius_source_sha: $SGNS_SOURCE_SHA"
          } | tee "$stage/node-example-ldd.txt"
          echo "session binary sha256: $sha"
          echo "SuperGenius develop source sha: $SGNS_SOURCE_SHA"
          {
            echo "## staging-session-bin (source-built session binary, 05-03)"
            echo
            echo "- node_example sha256: $sha"
            echo "- SuperGenius develop source sha: $SGNS_SOURCE_SHA"
            echo "- ldd gate: zero not-found entries; configure log carries no 3.6.0 (no sed in this leg)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the session binary
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: staging-session-bin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/session-bin-stage
          if-no-files-found: error
          retention-days: 14

  # The version-skew refusal leg (D-10, 05-03 Task 1 / NET-03's second axis):
  # the SAME source-build machinery with an honestly-labeled franken-build —
  # sed PROJECT_VERSION 3.7.0 -> 3.6.0 on the CHECKED-OUT develop source
  # (major.minor ONLY: the topic appendix carries .{major}.{minor}.{net}, so
  # patch skew is wire-invisible — Pitfall 6) — then the GeniusSDK runner
  # built against that install tree, booted keyless in-container through the
  # repo's own wrapper, and refused per D-07's operational definition (the
  # same three observables as staging-refuse-net). The sed touches the CI
  # workspace copy ONLY — never a repo file, never a published artifact; the
  # 3.6 binary exists solely inside this job and its evidence upload. One
  # staging-refuse dispatch runs BOTH refusal legs (refuse-net plus this).
  staging-refuse-version:
    needs: resolve-runners
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'staging-refuse' }}
    runs-on: ${{ fromJson(needs.resolve-runners.outputs.linux_x64) }}
    timeout-minutes: 240
    env:
      GRPC_BUILD_ENABLE_CCACHE: "ON"
      GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
    container:
      image: ghcr.io/geniusventures/almalinux-8:latest
      # IPC_LOCK mirrors the e2e job's container block (copied verbatim): the
      # in-container gnome-keyring-daemon below (through sgns-node-wrap.sh)
      # needs it — same EPERM trap the e2e harness's dbus wrapper documents.
      options: --cap-add=IPC_LOCK
      credentials:
        username: ${{github.actor}}
        password: ${{secrets.GNUS_TOKEN_1}}
    steps:
      - name: Clean workspace (self-hosted runners)
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          # Container jobs leave root-owned build trees behind; clear the four
          # build-input dirs so this job's downloads/checkouts start clean
          # (the e2e job's cleanup step, same guards).
          SUDO=""
          if [ "$(uname)" = "Linux" ]; then
            SUDO="sudo"
          fi
          for dir in thirdparty zkLLVM SuperGenius GeniusSDK; do
            if [ -d "$dir" ]; then
              echo "Removing $dir directory..."
              $SUDO rm -rf "$dir"
            fi
          done

      - name: Checkout GeniusSDK (topology.py + the wrapper at the dispatch ref)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: "GeniusSDK"
          submodules: "recursive"

      - name: Set build directory
        shell: bash
        run: |
          # Same abi-suffixed layout as the e2e job — both build trees below
          # (SuperGenius source + GeniusSDK) and the downloaded releases
          # share the shape.
          BUILD_DIRECTORY=build/Linux/Release/x86_64
          echo "BUILD_DIRECTORY=$BUILD_DIRECTORY" >> $GITHUB_ENV

      - name: Download thirdparty release
        working-directory: ${{github.workspace}}
        shell: bash
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.pull_request.head.ref }}
        run: |
          # Determine current branch or tag
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${GITHUB_EVENT_INPUTS_TAG}" ]; then
            CURRENT_BRANCH="${GITHUB_EVENT_INPUTS_TAG}"
            IS_TAG=true
          elif ${{github.event_name == 'pull_request'}}; then
            CURRENT_BRANCH=${GITHUB_EVENT_PULL_REQUEST_HEAD_REF}
            IS_TAG=false
          else
            CURRENT_BRANCH=$GITHUB_REF_NAME
            IS_TAG=false
          fi

          echo "Identified current branch/tag as ${CURRENT_BRANCH}"
          echo "CURRENT_BRANCH=${CURRENT_BRANCH}" >>$GITHUB_ENV
          echo "IS_TAG=${IS_TAG}" >>$GITHUB_ENV

          # Determine thirdparty branch to use
          if [ "$IS_TAG" == "true" ]; then
            thirdparty_branch="$CURRENT_BRANCH"
          elif [ "$CURRENT_BRANCH" == "main" ]; then
            thirdparty_branch="main"
          else
            thirdparty_branch="develop"
          fi

          echo "Using ${thirdparty_branch} for thirdparty"

          FILE_NAME=Linux-x86_64-Release.tar.gz
          echo "FILE_NAME=${FILE_NAME}" >> $GITHUB_ENV

          mkdir thirdparty
          cd thirdparty

          if [ "$IS_TAG" == "true" ]; then
            tag_name="${thirdparty_branch}"
          else
            tag_name="Linux-x86_64-${thirdparty_branch}-Release"
          fi

          gh release download ${tag_name} --repo GeniusVentures/thirdparty -p "${FILE_NAME}"
          tar -zxf "${FILE_NAME}"

          echo "THIRDPARTY_BUILD_DIR=$(pwd)/${BUILD_DIRECTORY}" >> $GITHUB_ENV

      - name: Download zkLLVM release
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          # Use same branch determination logic for zkLLVM
          if [ "$IS_TAG" == "true" ]; then
            zkLLVM_branch="$CURRENT_BRANCH"
          elif [ "$CURRENT_BRANCH" == "main" ]; then
            zkLLVM_branch="main"
          else
            zkLLVM_branch="develop"
          fi

          mkdir zkLLVM
          cd zkLLVM

          ZKLLVM_FILE_NAME=Linux-x86_64-Release.tar.gz
          ZKLLVM_BUILD_DIR=${BUILD_DIRECTORY}
          if [ "$IS_TAG" == "true" ]; then
            tag_name="${zkLLVM_branch}"
          else
            tag_name="Linux-x86_64-${zkLLVM_branch}-Release"
          fi

          gh release download ${tag_name} --repo GeniusVentures/zkLLVM -p "${ZKLLVM_FILE_NAME}"

          tar --exclude='*bin/assigner' --exclude='*bin/clang-zkllvm' --exclude='*bin/llvm-link-zkllvm' --exclude='*bin/transpiler' -zxf "${ZKLLVM_FILE_NAME}"

          echo "ZKLLVM_BUILD_DIR=$(pwd)/${ZKLLVM_BUILD_DIR}" >> $GITHUB_ENV

      - name: Checkout SuperGenius source at develop
        # The sed target: a fresh develop checkout whose cmake/version.cmake
        # the franken-build step below edits IN THE WORKSPACE COPY. The exact
        # commit is recorded and carried into the evidence.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: GeniusVentures/SuperGenius
          ref: develop
          path: SuperGenius
          submodules: "recursive"
          token: ${{ secrets.GNUS_TOKEN_1 }}
          persist-credentials: false

      - name: Record the SuperGenius source SHA
        shell: bash
        run: |
          set -euo pipefail
          SGNS_SOURCE_SHA="$(git -C SuperGenius rev-parse HEAD)"
          echo "SGNS_SOURCE_SHA=$SGNS_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "SuperGenius develop source (pre-sed): $SGNS_SOURCE_SHA"
          grep '^set(PROJECT_VERSION' SuperGenius/cmake/version.cmake

      - name: Provision python3.12
        shell: bash
        run: |
          # EL8's default python3 is 3.6; topology.py needs 3.8+ (invoked as
          # python3.12 explicitly everywhere — the e2e job's step). The JSON
          # asserts below ride the same interpreter instead of jq (not
          # guaranteed in the EL8 image).
          if command -v python3.12 >/dev/null 2>&1; then
            echo "python3.12 already present"
          elif command -v dnf >/dev/null 2>&1; then
            SUDO=""
            command -v sudo >/dev/null 2>&1 && SUDO="sudo"
            $SUDO dnf install -y python3.12
          else
            sudo apt-get update
            sudo apt-get install -y python3.12
          fi
          python3.12 --version

      - name: Fetch the canonical artifact pair + fingerprint assert (JOIN.md §2)
        # The cheap join machinery FIRST (fail-fast before the multi-hour
        # build chain): the artifact set is the same canonical develop pair
        # every joiner consumes.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging-net
          curl -fsSL -o staging-net/staging-net.json \
            https://raw.githubusercontent.com/GeniusVentures/GeniusSDK/develop/deploy/staging-net/staging-net.json
          curl -fsSL -o staging-net/manifest.bin \
            https://raw.githubusercontent.com/GeniusVentures/GeniusSDK/develop/deploy/staging-net/manifest.bin
          recorded="$(python3.12 -c 'import json;print(json.load(open("staging-net/staging-net.json"))["ceremony_fingerprint"])')"
          actual="$(sha256sum staging-net/manifest.bin | cut -d' ' -f1)"
          if [ -z "$recorded" ] || [ "$actual" != "$recorded" ]; then
            echo "FATAL: sha256(manifest.bin) $actual != ceremony_fingerprint ${recorded:-<none>} — re-fetch the artifact set before anything else (JOIN.md troubleshooting)" >&2
            exit 1
          fi
          echo "artifact fingerprint verified: $actual"

      - name: Generate the joiner bundle (topology.py --join)
        shell: bash
        run: |
          set -euo pipefail
          python3.12 GeniusSDK/e2e/topology.py --join staging-net --out-dir joiners --count 1
          net_id="$(python3.12 -c 'import json;print(json.load(open("joiners/joiner1/sgns_config.json"))["net_id"])')"
          if [ "$net_id" != "333" ]; then
            echo "FATAL: joiner sgns_config net_id=$net_id != 333 — this leg's mismatch is the BINARY's compiled-in version; the config must stay correct" >&2
            exit 1
          fi
          tm="$(python3.12 -c 'import json;print(json.load(open("joiners/joiner1/log_config.json"))["loggers"]["TransactionManager"])')"
          if [ "$tm" != "info" ]; then
            echo "FATAL: joiner log_config TransactionManager=$tm != info — the dispatched ref predates 05-01's D-09 promotion" >&2
            exit 1
          fi
          echo "joiner bundle: net_id=333, TransactionManager=info (D-09) — the skew rides the franken 3.6 binary, not the config"

      - name: Configure Linux host
        if: ${{ runner.os == 'Linux'}}
        run: |
          sudo update-alternatives --install /usr/bin/cc cc $(which clang) 100
          sudo update-alternatives --install /usr/bin/c++ c++ $(which clang++) 100
          sudo update-alternatives --set cc $(which clang)
          sudo update-alternatives --set c++ $(which clang++)

          # The e2e job's package set plus the SuperGenius release workflow's
          # source-build additions (same merged set as staging-session-bin).
          if command -v dnf >/dev/null 2>&1; then
            if ! rpm -q ccache ninja-build vulkan-loader-devel vulkan-headers libsecret-devel libzstd-devel which perl perl-IPC-Cmd >/dev/null 2>&1; then
              sudo dnf install -y ccache ninja-build vulkan-loader-devel vulkan-headers libsecret-devel libzstd-devel which perl perl-IPC-Cmd
            fi
          else
            sudo apt install ccache ninja-build libvulkan-dev libzstd-dev libsecret-1-dev -y
          fi
          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV

      - name: Install bindgen + wasm Rust target
        # Unconditional source-build steps from SuperGenius's
        # build-release-tags.yml (mirrored, as in staging-session-bin).
        run: |
          cargo install cbindgen
          rustup target add wasm32-unknown-emscripten

      - name: "Apply the fake-old 3.6 sed to the checked-out source (D-10 mechanism test)"
        # Honest labeling: a SYNTHESIZED version skew (no published
        # old-major.minor binary exists — every image/tag is 3.7.0) testing
        # the REAL wire mechanism, the topic-appendix segregation on
        # .{major}.{minor}. The sed hits ONLY the CI workspace copy of
        # develop; major.minor changes, patch stays .0.
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/set(PROJECT_VERSION 3\.7\.0)/set(PROJECT_VERSION 3.6.0)/' SuperGenius/cmake/version.cmake
          if ! grep -q 'set(PROJECT_VERSION 3\.6\.0)' SuperGenius/cmake/version.cmake; then
            echo "FATAL: the version sed did not bite — develop's version.cmake no longer matches set(PROJECT_VERSION 3.7.0); update the sed pattern" >&2
            exit 1
          fi
          echo "franken-build version applied (fake-old 3.6 mechanism test, D-10):"
          grep '^set(PROJECT_VERSION' SuperGenius/cmake/version.cmake

      - name: Configure CMake for the SuperGenius source build
        working-directory: ${{ github.workspace }}/SuperGenius
        shell: bash
        run: |
          set -euo pipefail
          # The exact Linux-leg invocation of build-release-tags.yml (same as
          # staging-session-bin) — tee'd, and GATED on the franken version
          # actually reaching CMake (the compiled-in appendix is generated
          # from these macros at configure time).
          cmake -S build/Linux -B "$BUILD_DIRECTORY" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSGNS_NETWORK=release \
            -DCMAKE_C_COMPILER="$(which clang)" \
            -DCMAKE_CXX_COMPILER="$(which clang++)" \
            -DTHIRDPARTY_DIR="$GITHUB_WORKSPACE/thirdparty" \
            -DTHIRDPARTY_BUILD_DIR="$THIRDPARTY_BUILD_DIR" \
            -DZKLLVM_DIR="$ZKLLVM_BUILD_DIR" \
            -DZKLLVM_BUILD_DIR="$ZKLLVM_BUILD_DIR" \
            -DABI_SUBFOLDER_NAME=x86_64 \
            2>&1 | tee "$GITHUB_WORKSPACE/supergenius-configure.log"
          if ! grep -q 'PROJECT_VERSION: 3\.6\.0' "$GITHUB_WORKSPACE/supergenius-configure.log"; then
            echo "FATAL: the configure log lacks PROJECT_VERSION 3.6.0 — the sed did not reach the build" >&2
            exit 1
          fi

      - name: Build SuperGenius (franken tree)
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          # Full default build, exactly like build-release-tags.yml: the
          # install rules cover the exported targets, not just genius_node.
          cmake --build . --config Release -j

      - name: Install the SuperGenius tree (phase-2 local precedent)
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          # CommonCompilerOptions sets CMAKE_INSTALL_PREFIX to the build
          # dir's SuperGenius/ — the exact install-tree layout the release
          # tarball carries and GeniusSDK's SUPERGENIUS_DIR consumption
          # expects (<root>/build/Linux/Release/x86_64/SuperGenius/...).
          cmake --install . --config Release
          if [ ! -d "$GITHUB_WORKSPACE/SuperGenius/${BUILD_DIRECTORY}/SuperGenius/lib/cmake/SuperGenius" ]; then
            echo "FATAL: install tree missing the SuperGenius CMake package dir" >&2
            exit 1
          fi

      - name: Configure CMake for Linux (GeniusSDK against the franken install tree)
        working-directory: ${{ github.workspace }}/GeniusSDK
        shell: bash
        run: |
          set -euo pipefail
          # The e2e job's GeniusSDK invocation with SUPERGENIUS_DIR pointed
          # at the source checkout root whose build/.../SuperGenius install
          # tree the step above created — producing a GeniusSDKService whose
          # compiled-in topic appendix is .3.6.333.
          cmake -S build/Linux -B "$BUILD_DIRECTORY" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$(which clang)" \
            -DCMAKE_CXX_COMPILER="$(which clang++)" \
            -DTHIRDPARTY_BUILD_DIR="$THIRDPARTY_BUILD_DIR" \
            -DZKLLVM_BUILD_DIR="$ZKLLVM_BUILD_DIR" \
            -DSUPERGENIUS_DIR="$GITHUB_WORKSPACE/SuperGenius" \
            -DABI_SUBFOLDER_NAME='/x86_64' \
            2>&1 | tee "$GITHUB_WORKSPACE/geniussdk-configure.log"

      - name: Build GeniusSDK (the 3.6-appendix runner)
        working-directory: ${{ github.workspace }}/GeniusSDK/${{ env.BUILD_DIRECTORY }}
        shell: bash
        run: cmake --build . --config Release -j

      - name: Resolve the franken runner binary
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_BIN="$GITHUB_WORKSPACE/GeniusSDK/${BUILD_DIRECTORY}/services/GeniusSDKService"
          if [ ! -x "$RUNNER_BIN" ]; then
            RUNNER_BIN="$(find "$GITHUB_WORKSPACE/GeniusSDK/build" -type f -name GeniusSDKService -perm -u+x 2>/dev/null | head -n 1)"
          fi
          if [ -z "$RUNNER_BIN" ] || [ ! -x "$RUNNER_BIN" ]; then
            echo "FATAL: franken GeniusSDKService not found under the GeniusSDK build tree" >&2
            exit 1
          fi
          echo "RUNNER_BIN=$RUNNER_BIN" >> "$GITHUB_ENV"
          echo "franken runner: $RUNNER_BIN (sha256 $(sha256sum "$RUNNER_BIN" | cut -d' ' -f1))"

      - name: "Boot the franken joiner in-container + refusal gate (D-07, 12-min bound)"
        # Keyless (D-11) through the repo's own wrapper, inside THIS
        # container: the EL8 image carries dbus + gnome-keyring (the e2e
        # ctest shape) and IPC_LOCK rides the container options. timeout 780
        # bounds the joiner's lifetime at 13 min via SIGTERM — the runner's
        # honored lifetime contract (e3fff7e/b192165) — one minute past the
        # 12-min refusal bound. The three observables are staging-refuse-net's
        # exact gate: the recurring blockchain-failure pair strictly
        # increasing across the bound, zero READY (HALF-JOIN-DETECTED if
        # not), zero head=. NOTE the version axis lands its recurring pair at
        # a DIFFERENT stage than the net axis (observed, run 39328864467):
        # same-version-wrong-net parks in INITIALIZING_BLOCKCHAIN printing
        # "Scheduling blockchain retry after failure" on stdout, while the
        # 3.6 franken parks in MIGRATING_DATABASE with the recurring
        # "Error starting blockchain: Blockchain not fully initialized"
        # pair in the base dir's sgnslog2.log — the DB migration path is
        # version-keyed, so the blockchain never even starts. Both families
        # are counted, across BOTH logs (Pitfall 4: console-sink builds ride
        # stdout; the promoted file sink carries the rest).
        shell: bash
        run: |
          set -euo pipefail
          export GENIUSSDK_BIN="$RUNNER_BIN"
          export GENIUSSDK_BASE="$GITHUB_WORKSPACE/joiners/joiner1/"
          : > fake-old-joiner.log
          : > refuse-samples.log
          dbus-run-session -- bash -c \
            'timeout 780 bash "$GITHUB_WORKSPACE/GeniusSDK/deploy/sgns-node-wrap.sh"' \
            > fake-old-joiner.log 2>&1 &
          JOINER_PID=$!
          counts=()
          for i in $(seq 1 12); do
            sleep 60
            if ! kill -0 "$JOINER_PID" 2>/dev/null; then
              echo "FATAL: the fake-old 3.6 joiner exited at sample $i — not the expected persistent-retry refusal shape" >&2
              exit 1
            fi
            ts="$(date -u +%FT%TZ)"
            retries=0
            for f in fake-old-joiner.log joiners/joiner1/sgnslog2.log; do
              if [ -f "$f" ]; then
                n="$(grep -c 'Scheduling blockchain retry after failure' "$f" || true)"
                retries=$(( retries + n ))
                n="$(grep -c 'Error starting blockchain' "$f" || true)"
                retries=$(( retries + n ))
              fi
            done
            echo "REFUSE-3.6 $ts retries=$retries" | tee -a refuse-samples.log
            counts+=("$retries")
          done
          set +e
          wait "$JOINER_PID"
          joiner_rc=$?
          set -e
          third="${counts[3]}"
          last="${counts[11]}"
          echo "joiner lifetime: bounded by timeout 780 (rc=$joiner_rc; 124 is the expected SIGTERM bound)"
          if [ "$last" -le "$third" ]; then
            echo "FATAL: the recurring blockchain-failure pair stopped between the one-third mark (retries=$third) and the end (retries=$last) — persistence plus never-READY is the D-07 proof" >&2
            exit 1
          fi
          if grep -q 'node_state=READY' fake-old-joiner.log; then
            echo "FATAL: HALF-JOIN-DETECTED — node_state=READY observed on the fake-old 3.6 joiner" >&2
            exit 1
          fi
          if [ -f joiners/joiner1/sgnslog2.log ] && grep -q 'node_state=READY' joiners/joiner1/sgnslog2.log; then
            echo "FATAL: HALF-JOIN-DETECTED — node_state=READY observed in the joiner base dir sgnslog2.log" >&2
            exit 1
          fi
          if grep -q 'head=' fake-old-joiner.log; then
            echo "FATAL: a head= line was observed on the fake-old 3.6 joiner" >&2
            exit 1
          fi
          if [ -f joiners/joiner1/sgnslog2.log ] && grep -q 'head=' joiners/joiner1/sgnslog2.log; then
            echo "FATAL: a head= line was observed in the joiner base dir sgnslog2.log" >&2
            exit 1
          fi
          echo "refusal proven per D-07 (version-skew axis): recurring blockchain-failure pair $third -> $last (still recurring at the bound), zero node_state=READY, zero head="
          # Corroborating, NOT a hard gate (same stance as refuse-net): the
          # quarantined joiner exchanged nothing (topic-appendix segregation).
          find joiners/joiner1 -maxdepth 2 | sort | tee refuse-baseir.log || true
          {
            echo "## staging-refuse-version (version-skew mechanism test, franken-build D-10)"
            echo
            echo "- leg: version-skew mechanism test (franken-build, D-10) — sed set(PROJECT_VERSION 3.7.0) -> 3.6.0 on the checked-out develop source (major.minor only, workspace copy only)"
            echo "- SuperGenius develop source sha: $SGNS_SOURCE_SHA"
            echo "- recurring blockchain-failure pair: $third -> $last across the 12-min bound (still recurring; both retry families, stdout + sgnslog2.log)"
            echo "- node_state=READY lines: 0; head= lines: 0 (tee'd log + base-dir sgnslog2.log scanned)"
            echo '```'
            cat refuse-samples.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage evidence + cleanup
        # ONE flat dir (the 04-02 LCA lesson); the configure log rides along
        # as the in-run record that the 3.6 version actually reached CMake.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          if [ -f fake-old-joiner.log ]; then cp fake-old-joiner.log evidence/; fi
          if [ -f refuse-samples.log ]; then cp refuse-samples.log evidence/; fi
          if [ -f refuse-baseir.log ]; then cp refuse-baseir.log evidence/; fi
          if [ -f joiners/joiner1/sgns_config.json ]; then cp joiners/joiner1/sgns_config.json evidence/; fi
          if [ -f joiners/joiner1/log_config.json ]; then cp joiners/joiner1/log_config.json evidence/; fi
          if [ -f joiners/joiner1/sgnslog2.log ]; then cp joiners/joiner1/sgnslog2.log evidence/; fi
          if [ -f "$GITHUB_WORKSPACE/supergenius-configure.log" ]; then cp "$GITHUB_WORKSPACE/supergenius-configure.log" evidence/; fi
          # Guarded pkill — never fail the job from cleanup (e2e job's step).
          pkill -x GeniusSDKService 2>/dev/null || true

      - name: Upload refusal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-refuse-version-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
